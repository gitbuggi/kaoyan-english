/* ===== Selection & Float Bar ===== */
let floatBar = null;
let clickTimer = null;

document.addEventListener('mousedown', e => {
  if (e.target.closest('.float-bar')) return;
  if (e.target.closest('.vocab-popover')) return;
  if (e.target.closest('[data-action="show-vocab"]')) return;
  removeFloatBar();
  closeVocabPopover();
}, true);
window.addEventListener('scroll', () => removeFloatBar(), true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') removeFloatBar();
});

document.addEventListener('mouseup', e => {
  if (state.page !== 'annotate') return;
  if (e.target.closest('.float-bar')) return;
  if (e.target.closest('.opt-key')) return;
  if (e.target.closest('input, textarea, button')) return;
  if (e.target.closest('[data-action="show-vocab"]')) return;
  if (e.target.closest('[data-action="del-vocab-pop"]')) return;
  const host = e.target.closest('.para, .opt-text, .q-stem-text');
  if (!host) return;

  // 每次点击清除上一次的计时器
  if (clickTimer) clearTimeout(clickTimer);

  // 记录当前是第几次点击
  const count = e.detail;

  // 设置 250ms 的等待窗口，如果期间没有继续点击，才执行对应的操作
  clickTimer = setTimeout(() => {
    if (count === 2) {
      // 双击：选中单词
      selectWordAt(e.clientX, e.clientY);
    } else if (count === 3) {
      // 三击：选中句子
      selectSentenceAt(e.clientX, e.clientY);
    } else if (count >= 4) {
      // 四击及以上：选中整个段落
      selectParagraphAt(e.clientX, e.clientY);
    }
    
    // 选完后弹出悬浮工具栏
    // 如果是单击拖拽（count === 1），selectedText 就是用户拖拽的文字，会自动弹出；
    // 如果是单纯单击，selectedText 为空，showFloatBarAt 内部会直接 return，不会弹出。
    showFloatBarAt(e.pageX, e.pageY);
    clickTimer = null;
  }, 250);
});

/* 任何方式产生的选区（含 iPad 拖拽选区手柄）都弹出工具条 */
let selTimer = null;
document.addEventListener('selectionchange', () => {
  if (state.page !== 'annotate') return;
  if (selTimer) clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) return;
    const text = sel.toString().trim();
    if (!text || text.length < 2 || text.length > 400) return;
    if (floatBar && state.selectedText === text) return;  // 同一条选区不重建
    let rect = null;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (err) {}
    if (!rect || (!rect.width && !rect.height)) return;
    showFloatBarAt(0, 0, rect);
  }, 300);
});

/* 屏蔽长按弹出的系统菜单（拷贝/查词/共享），改用应用内工具条 */
document.addEventListener('contextmenu', e => {
  if (state.page !== 'annotate') return;
  if (e.target.closest && e.target.closest('.para, .opt-text, .q-stem-text')) {
    e.preventDefault();
  }
});

function selectWordAt(clientX, clientY) {
  let range = null;
  if (document.caretRangeFromPoint) {
    range = document.caretRangeFromPoint(clientX, clientY);
  } else if (document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(clientX, clientY);
    if (pos) {
      range = document.createRange();
      range.setStart(pos.offsetNode, pos.offset);
      range.collapse(true);
    }
  }
  if (!range) return;
  const node = range.startContainer;
  if (node.nodeType !== 3) return;
  const text = node.nodeValue;
  const offset = range.startOffset;
  const isWordChar = c => /[A-Za-z0-9'\-_]/.test(c);
  let start = offset;
  while (start > 0 && isWordChar(text[start - 1])) start--;
  let end = offset;
  while (end < text.length && isWordChar(text[end])) end++;
  if (start === end) {
    if (offset < text.length && isWordChar(text[offset])) {
      end = offset;
      while (end < text.length && isWordChar(text[end])) end++;
    } else { return; }
  }
  if (start >= end) return;
  const nr = document.createRange();
  nr.setStart(node, start);
  nr.setEnd(node, end);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(nr);
}

function showFloatBarAt(pageX, pageY, rect) {
  const sel = window.getSelection();
  const text = sel.toString().trim();
  removeFloatBar();
  if (!text || text.length < 2 || text.length > 400) return;
  const range = sel.getRangeAt(0);
  let node = range.startContainer;
  let el = node.nodeType === 3 ? node.parentElement : node;
  if (!el || !el.closest) return;
  const paraEl = el.closest('.para');
  const optEl = el.closest('.opt-text');
  const stemEl = el.closest('.q-stem-text');
  if (!paraEl && !optEl && !stemEl) return;
  state.selectedText = text;
  state.selectedPara = paraEl ? parseInt(paraEl.dataset.para) : 0;
  state.selectedContext = getSelectionContext();
  // 新增：记录是在文章里选的，还是在题目/选项里选的
  if (paraEl) {
    state.selectedTarget = 'article';
    state.selectedQid = null;
    state.selectedOpt = null;
  } else {
    state.selectedTarget = 'question';
    // 向上找最近的题目卡片
    const card = el.closest('.q-card');
    state.selectedQid = card ? card.dataset.qid : null;
    
    // 向上找最近的选项行
    const optRow = el.closest('.opt-row');
    if (optRow) {
      const optKeyEl = optRow.querySelector('.opt-key');
      state.selectedOpt = optKeyEl ? optKeyEl.textContent.trim() : null;
    } else {
      state.selectedOpt = null; // 说明是在题干里选的
    }
  }
  let buttons = '';
  const wordCount = text.trim().split(/\s+/).filter(Boolean).length;
  if (paraEl && wordCount >= 2) {
    buttons += `<button class="fb-loc" data-action="add-location" title="加为定位句">${ICONS.target}</button>`;
  }
  buttons += `<button class="fb-vocab" data-action="add-vocab" title="加入生词本">${ICONS.bookmark}</button>`;
  floatBar = document.createElement('div');
  floatBar.className = 'float-bar';
  floatBar.innerHTML = buttons;
  document.body.appendChild(floatBar);

  const barW = floatBar.offsetWidth, barH = floatBar.offsetHeight;
  let left, top;
  if (rect && (rect.width || rect.height)) {
    left = rect.left + window.scrollX;
    top = rect.bottom + window.scrollY + 8;
    // 选区下方放不下时翻到上方
    if (rect.bottom + barH + 16 > window.innerHeight) {
      top = rect.top + window.scrollY - barH - 8;
    }
  } else {
    left = pageX + 8;
    top = pageY + 8;
  }
  const minLeft = window.scrollX + 8;
  const maxLeft = window.scrollX + window.innerWidth - barW - 8;
  left = Math.max(minLeft, Math.min(left, maxLeft));
  floatBar.style.left = left + 'px';
  floatBar.style.top = top + 'px';
}
function getSelectionContext() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  let el = range.startContainer;
  el = el.nodeType === 3 ? el.parentElement : el;
  const para = el.closest ? el.closest('.para') : null;
  if (!para) return null;
  
  const preRange = document.createRange();
  preRange.selectNodeContents(para);
  preRange.setEnd(range.startContainer, range.startOffset);
  const leftContext = preRange.toString().slice(-20); // 前面 20 个字符
  
  const postRange = document.createRange();
  postRange.selectNodeContents(para);
  postRange.setStart(range.endContainer, range.endOffset);
  const rightContext = postRange.toString().slice(0, 20); // 后面 20 个字符

  return { left: leftContext, right: rightContext };
}
function removeFloatBar() {
  if (floatBar) { floatBar.remove(); floatBar = null; }
}

function selectSentenceAt(clientX, clientY) {
  let range = document.caretRangeFromPoint ? document.caretRangeFromPoint(clientX, clientY) : null;
  if (!range && document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(clientX, clientY);
    if (pos) {
      range = document.createRange();
      range.setStart(pos.offsetNode, pos.offset);
    }
  }
  if (!range) return;
  const startNode = range.startContainer;
  if (startNode.nodeType !== 3) return;
  const host = startNode.parentElement && startNode.parentElement.closest
    ? startNode.parentElement.closest('.para, .opt-text, .q-stem-text') : null;
  if (!host) return;
  const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const positions = [];
  let fullText = '';
  nodes.forEach(node => {
    positions.push({ node, start: fullText.length, end: fullText.length + node.nodeValue.length });
    fullText += node.nodeValue;
  });
  let clickOffset = -1;
  for (const p of positions) {
    if (p.node === startNode) { clickOffset = p.start + range.startOffset; break; }
  }
  if (clickOffset < 0) return;
  let start = clickOffset;
  while (start > 0 && !/[.?!。？！\n]/.test(fullText[start - 1])) start--;
  while (start < clickOffset && /[\s.?!。？！]/.test(fullText[start])) start++;
  let end = clickOffset;
  while (end < fullText.length && !/[.?!。？！\n]/.test(fullText[end])) end++;
  if (end < fullText.length && /[.?!。？！]/.test(fullText[end])) end++;
  if (start >= end) return;
  function locate(off) {
    for (const p of positions) {
      if (off >= p.start && off < p.end) return { node: p.node, offset: off - p.start };
    }
    const last = positions[positions.length - 1];
    return { node: last.node, offset: last.node.nodeValue.length };
  }
  const sp = locate(start);
  const ep = locate(end);
  const nr = document.createRange();
  nr.setStart(sp.node, sp.offset);
  nr.setEnd(ep.node, ep.offset);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(nr);
}
function selectParagraphAt(clientX, clientY) {
  let range = document.caretRangeFromPoint ? document.caretRangeFromPoint(clientX, clientY) : null;
  if (!range && document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(clientX, clientY);
    if (pos) {
      range = document.createRange();
      range.setStart(pos.offsetNode, pos.offset);
    }
  }
  if (!range) return;
  const startNode = range.startContainer;
  if (startNode.nodeType !== 3) return;
  
  // 找到所在的整个段落/题干/选项容器
  const host = startNode.parentElement && startNode.parentElement.closest
    ? startNode.parentElement.closest('.para, .opt-text, .q-stem-text') : null;
  if (!host) return;

  // 直接选中容器的全部内容
  const nr = document.createRange();
  nr.selectNodeContents(host);
  
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(nr);
}

}

function getSourceLabel() {
  const paper = getCurrentPaper();
  const section = getCurrentSection();
  if (!paper) return '';
  const year = paper.year;
  if (!section) return String(year);
  let tag = '';
  if (section.id === 'reading-a') tag = 'T' + (state.passageIndex + 1);
  else if (section.id === 'cloze') tag = '完型';
  else if (section.id === 'reading-b') tag = '新题型';
  else if (section.id === 'translation') tag = '翻译';
  else if (section.id === 'writing') tag = '写作';
  return tag ? `${year} ${tag}` : String(year);
}

function addVocab() {
  const text = normalizeKeepLength(state.selectedText).trim();
  removeFloatBar();
  if (!text) return;
  const vocab = window.ANNOTATIONS.vocab || (window.ANNOTATIONS.vocab = []);
  const source = getSourceLabel();

  // ==========================================
  // 【核心修复】：增加容错匹配逻辑
  // ==========================================
  let dictEntry = null;
  if (window.EXAM_DICT) {
    // 1. 先尝试全小写精确匹配
    const key = text.toLowerCase();
    dictEntry = window.EXAM_DICT[key];
    
    // 2. 如果没找到，尝试去掉首尾可能被误选中的标点符号（如引号、逗号、句号）
    if (!dictEntry) {
      const cleanKey = key.replace(/^[^a-z]+|[^a-z]+$/g, '');
      if (cleanKey) {
        dictEntry = window.EXAM_DICT[cleanKey];
      }
    }
    // 3. 如果还没找到，尝试去掉尾部复数/时态（如 's', 'ed', 'ing'）再查一次（可选，最稳妥）
    if (!dictEntry && key.endsWith('s')) {
      dictEntry = window.EXAM_DICT[key.slice(0, -1)];
    }
  }

  const autoMeaning = dictEntry ? dictEntry.meaning : '';
  const autoCategory = dictEntry ? dictEntry.category : '';
  // ==========================================

  // 寻找是否存在重复记录
  const existSame = vocab.findIndex(v => {
    if (vocabMark(v) !== text) return false;
    if (v.source !== source) return false;
    if (!v.context || !state.selectedContext) {
      return (v.para || 0) === (state.selectedPara || 0);
    }
    return (v.context.left || '') === (state.selectedContext.left || '') &&
           (v.context.right || '') === (state.selectedContext.right || '');
  });

  if (existSame >= 0) {
    if (!confirm(`"${text}" (${source}) 该位置的生词已在生词本中，要删除吗？`)) return;
    vocab.splice(existSame, 1);
    scheduleSave();
    if (state.page === 'annotate') renderArticle();
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  
  // 标题加上分类标签
  const badgeHtml = autoCategory 
    ? `<span style="font-size:11px;font-weight:normal;background:#f1f5f9;color:#64748b;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;">${autoCategory}</span>` 
    : '';

  overlay.innerHTML = `
    <div class="modal">
      <h3>添加生词 ${badgeHtml}</h3>
      <div class="modal-body">
        <div style="margin-bottom:10px;">
          <input id="vocab-display-input" value="${esc(text)}"
                 placeholder="单词 / 短语"
                 style="width:100%;padding:8px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;outline:none;box-sizing:border-box;">
        </div>
        <div>
          <input id="vocab-meaning-input" placeholder="释义（可留空）"
                 value="${esc(autoMeaning)}"
                 style="width:100%;padding:8px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;outline:none;box-sizing:border-box;">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close-modal>取消</button>
        <button class="btn" data-save-vocab>添加</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const displayInput = overlay.querySelector('#vocab-display-input');
  const meaningInput = overlay.querySelector('#vocab-meaning-input');
  displayInput.focus();
  
  if (autoMeaning) {
    meaningInput.select(); 
  } else {
    displayInput.select();
  }

  overlay.querySelector('[data-close-modal]').onclick = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  const save = () => {
    const finalDisplay = displayInput.value.trim() || text;
    const meaning = meaningInput.value.trim();

    vocab.unshift({
      mark: text,
      display: finalDisplay,
      meaning: meaning,
      para: state.selectedPara || 0,
      context: state.selectedContext,
      target: state.selectedTarget || 'article',
      qid: state.selectedQid,
      optKey: state.selectedOpt,
      source: source,
      date: new Date().toISOString().slice(0, 10),
      category: autoCategory
    });
    overlay.remove();
    scheduleSave();
    if (state.page === 'annotate') {
      renderArticle();
      renderQuestions();
    }
    showToast('已加入生词本', 'success');
  };

  overlay.querySelector('[data-save-vocab]').onclick = save;
  meaningInput.onkeydown = e => { if (e.key === 'Enter') save(); };
  displayInput.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); meaningInput.focus(); } };
}

function renderFilter() {

    `<span class="tag-chip type ${state.filterTypes.includes(t) ? 'on' : ''}" data-action="filter-type" data-tag="${esc(t)}">${esc(t)}</span>`

  ).join('');

    `<span class="tag-chip ${state.filterMyTags.includes(t) ? 'on' : ''}" style="${state.filterMyTags.includes(t) ? 'background:var(--purple);color:#fff;border-color:var(--purple);' : ''}" data-action="filter-mytag" data-tag="${esc(t)}">${esc(t)}</span>`

      </div>

      <div class="filter-bar">

      </div>` : ''}
      <div class="filter-bar" style="margin-bottom:0;">

          ${statusBtn('all', '全部')}

function filterQuestions() {
  const papers = window.EXAM_DATA.papers || [];
  const results = [];
  papers.forEach(paper => {
    (paper.sections || []).forEach(section => {
      const allQ = [];
      if (section.questions) allQ.push(...section.questions);
      (section.passages || []).forEach(p => { if (p.questions) allQ.push(...p.questions); });
      allQ.forEach(q => {
        const ann = window.ANNOTATIONS.questions[annKey(paper, q.id)];
        if (!ann) return;
        if (state.filterTypes.length && !state.filterTypes.some(t => (ann.types || []).includes(t))) return;
        if (state.filterMethods.length && !state.filterMethods.some(m => (ann.methods || []).includes(m))) return;
        if (state.filterMyTags.length && !state.filterMyTags.some(t => (ann.myTags || []).includes(t))) return;
        if (state.filterStatus === 'wrong' && !ann.wrong) return;
        if (state.filterStatus === 'ok' && ann.wrong) return;
        if (state.filterStatus === 'undone' && ann.userAnswer) return;
        results.push({ paper, section, q, ann });
      });
    });
  });
  return results;
}

function renderFilterResult({ paper, section, q, ann }) {
  const num = q.id.replace(/^q/, '');
  const types = (ann.types || []).map(t => `<span class="tag-chip type on" style="cursor:default;">${esc(t)}</span>`).join('');
  const methods = (ann.methods || []).map(m => `<span class="tag-chip method on" style="cursor:default;">${esc(m)}</span>`).join('');
  const myTags = (ann.myTags || []).map(t => `<span class="tag-chip" style="cursor:default;background:var(--purple);color:#fff;border-color:var(--purple);">${esc(t)}</span>`).join('');
  const locs = (ann.locations || []).map(l =>
    `<div class="loc-item"><span class="loc-para">[${l.para}]</span><span class="loc-text">${esc(l.text)}</span></div>`
  ).join('');
  const doneInfo = ann.userAnswer
    ? `<span style="font-size:11.5px;color:${ann.wrong ? 'var(--danger)' : 'var(--success)'};font-weight:600;flex-shrink:0;">${ann.userAnswer} ${ann.wrong ? '错' : '对'}</span>`
    : '';

  let passageIdx = 0;
  if (section.id === 'reading-a' && section.passages) {
    const p = section.passages.find(ps => (ps.questions || []).some(x => x.id === q.id));
    if (p) passageIdx = section.passages.indexOf(p);
  }

  return `
    <div class="q-card" style="margin-bottom:10px;cursor:pointer;"
         data-action="jump-to-paper" data-paper="${paper.id}" data-section="${section.id}" data-passage="${passageIdx}">
      <div class="q-head">
        <span class="q-badge">${num}</span>
        <span class="q-stem-text">${esc(q.stem || '（无题干）')}</span>
        ${doneInfo}
      </div>
      <div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">${esc(paper.title)} · ${esc(section.name)}</div>
      ${locs ? `<div class="loc-panel" style="margin-top:6px;">${locs}</div>` : ''}
      ${(types || methods || myTags) ? `<div class="tag-chips" style="margin-top:8px;">${types} ${methods} ${myTags}</div>` : ''}
    </div>
  `;
}

/* ===== Stats ===== */
function renderStats() {
  const papers = window.EXAM_DATA.papers || [];
  const typeCount = {}, methodCount = {}, myTagCount = {}, optTagCount = {};
  let totalQ = 0, done = 0, wrong = 0, locTotal = 0;

  papers.forEach(paper => {
    (paper.sections || []).forEach(section => {
      const allQ = [];
      if (section.questions) allQ.push(...section.questions);
      (section.passages || []).forEach(p => { if (p.questions) allQ.push(...p.questions); });
      allQ.forEach(q => {
        totalQ++;
        const ann = window.ANNOTATIONS.questions[annKey(paper, q.id)];
        if (!ann) return;
        if (ann.userAnswer) done++;
        if (ann.wrong) wrong++;
        locTotal += (ann.locations || []).length;
        (ann.types || []).forEach(t => typeCount[t] = (typeCount[t] || 0) + 1);
        (ann.methods || []).forEach(m => methodCount[m] = (methodCount[m] || 0) + 1);
        (ann.myTags || []).forEach(t => myTagCount[t] = (myTagCount[t] || 0) + 1);
        Object.values(ann.options || {}).forEach(o => {
          (o.tags || []).forEach(t => optTagCount[t] = (optTagCount[t] || 0) + 1);
        });
      });
    });
  });

  const renderBars = (data, cls) => {
    const entries = Object.entries(data).sort((a, b) => b[1] - a[1]);
    if (!entries.length) return '<div class="empty" style="padding:16px;">暂无数据</div>';
    const max = Math.max(1, ...entries.map(e => e[1]));
    return entries.map(([k, v]) => `
      <div class="stat-row">
        <span class="name">${esc(k)}</span>
        <div class="stat-bar-wrap"><div class="stat-bar ${cls}" style="width:${(v / max * 100).toFixed(1)}%"></div></div>
        <span class="num">${v}</span>
      </div>
    `).join('');
  };

  return `
    <div class="card">
      <h1 style="font-size:20px;font-weight:700;margin-bottom:14px;">统计</h1>
      <div class="dash-grid">
        <div class="dash-box"><div class="num">${totalQ}</div><div class="label">总题数</div></div>
        <div class="dash-box done"><div class="num">${done}</div><div class="label">已做</div></div>
        <div class="dash-box wrong"><div class="num">${wrong}</div><div class="label">错题</div></div>
        <div class="dash-box"><div class="num">${locTotal}</div><div class="label">定位句</div></div>
      </div>
    </div>
    <div class="card"><h2>题型分布</h2>${renderBars(typeCount, 'type')}</div>
    <div class="card"><h2>方法使用</h2>${renderBars(methodCount, 'method')}</div>
    <div class="card"><h2>题目标签</h2>${renderBars(myTagCount, 'mytag')}</div>
    <div class="card"><h2>选项标签</h2>${renderBars(optTagCount, 'mytag')}</div>
  `;
}

function parseSource(source) {
  const m = String(source || '').match(/^(\d{4})\s+(.+)$/);
  if (!m) return null;
  return { year: parseInt(m[1]), tag: m[2].trim() };
}

function jumpToSource(source, word) {
  const parsed = parseSource(source);
  if (!parsed) { showToast('无法定位来源', 'error'); return; }
  const paper = (window.EXAM_DATA.papers || []).find(p => p.year === parsed.year);
  if (!paper) { showToast('找不到试卷', 'error'); return; }
  state.paperId = paper.id;

  let secId = 'reading-a';
  let passageIdx = 0;
  const tag = parsed.tag;
  if (tag.startsWith('T')) {
    secId = 'reading-a';
    passageIdx = parseInt(tag.slice(1)) - 1;
    if (isNaN(passageIdx) || passageIdx < 0) passageIdx = 0;
  } else if (tag === '完型') secId = 'cloze';
  else if (tag === '新题型') secId = 'reading-b';
  else if (tag === '翻译') secId = 'translation';
  else if (tag === '写作') secId = 'writing';

  state.sectionId = secId;
  state.passageIndex = passageIdx;
  state.page = 'annotate';
  render();

  // 高亮那个生词
  if (word) {
    setTimeout(() => {
      const marks = document.querySelectorAll('.vocab-mark');
      for (const el of marks) {
        if (el.textContent.trim() === word) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('flash');
          setTimeout(() => el.classList.remove('flash'), 1500);
          break;
        }
      }
    }, 100);
  }
}

/* ===== 文章搜索 ===== */
function collectMatches(text, ql) {
  const matches = [];
  const lower = text.toLowerCase();
  let from = 0;
  while (true) {
    const idx = lower.indexOf(ql, from);
    if (idx === -1) break;
    const start = Math.max(0, idx - 40);
    const end = Math.min(text.length, idx + ql.length + 80);
    const before = (start > 0 ? '…' : '') + text.slice(start, idx);
    const hit = text.slice(idx, idx + ql.length);
    const after = text.slice(idx + ql.length, end) + (end < text.length ? '…' : '');
    matches.push({ context: before + '§§' + hit + '§§' + after, match: hit });
    from = idx + ql.length;
    if (matches.length >= 5) break;  // 每段最多 5 处
  }
  return matches;
}

function searchArticles(ql) {
  const papers = window.EXAM_DATA.papers || [];
  const results = [];
  const MAX = 200;
  papers.forEach(paper => {
    (paper.sections || []).forEach(section => {
      // section.content（完型、翻译、Part B）
      if (section.content) {
        collectMatches(section.content, ql).forEach(m => {
          if (results.length >= MAX) return;
          const tag = section.id === 'reading-a'
            ? 'T' + (state.passageIndex + 1)
            : section.name;
          results.push({
            paper, section, passageIndex: 0,
            source: `${paper.year} ${section.name}`,
            context: m.context, match: m.match
          });
        });
      }
      // passages
      (section.passages || []).forEach((p, pi) => {
        if (p.content) {
          collectMatches(p.content, ql).forEach(m => {
            if (results.length >= MAX) return;
            results.push({
              paper, section, passageIndex: pi,
              source: `${paper.year} ${p.title || section.name}`,
              context: m.context, match: m.match
            });
          });
        }
      });
      // 题干
      const allQ = [];
      if (section.questions) allQ.push(...section.questions);
      (section.passages || []).forEach(p => { if (p.questions) allQ.push(...p.questions); });
      allQ.forEach(qItem => {
        if (results.length >= MAX) return;
        const stem = qItem.stem || '';
        if (stem.toLowerCase().includes(ql)) {
          let pi = 0;
          if (section.passages) {
            const foundP = section.passages.findIndex(p => (p.questions || []).some(x => x.id === qItem.id));
            if (foundP >= 0) pi = foundP;
          }
          const before = stem.slice(0, stem.toLowerCase().indexOf(ql));
          const hit = stem.slice(before.length, before.length + ql.length);
          const after = stem.slice(before.length + ql.length);
          results.push({
            paper, section, passageIndex: pi,
            source: `${paper.year} ${section.id === 'reading-a' ? 'T' + (pi + 1) : section.name} · ${qItem.id.replace('q', '')}题`,
            context: before + '§§' + hit + '§§' + after,
            match: hit
          });
        }
      });
    });
  });
  return results;
}

function jumpToArticleResult(paperId, sectionId, passageIndex, keyword) {
  state.paperId = paperId;
  state.sectionId = sectionId;
  state.passageIndex = passageIndex;
  state.searchHighlight = { text: keyword, paperId, sectionId, passageIndex };
  state.page = 'annotate';
  render();
  setTimeout(() => {
    const el = document.querySelector('.search-hit');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}
/* ===== Event Delegation ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const qid = el.dataset.qid;

  switch (action) {
    case 'toggle-section-answer': {
      const sid = el.dataset.section;
      const paper = getCurrentPaper();
      const section = getCurrentSection();
      
      // 如果是从“隐藏”切换到“显示”，则结算错题
      if (!state.showSectionAnswer[sid]) {
        const qs = getAllQuestionsInSection(section);
        const records = window.ANNOTATIONS.questions || {};
        let changed = false;

        qs.forEach(q => {
          const key = annKey(paper, q.id);
          const ann = records[key];
          // 如果用户做过这道题
          if (ann && ann.userAnswer && q.answer) {
            const correct = q.answer.trim().toUpperCase();
            const isWrong = ann.userAnswer !== correct;
            if (ann.wrong !== isWrong) {
              ann.wrong = isWrong;
              changed = true;
            }
          }
        });

        if (changed) scheduleSave();
      }

      state.showSectionAnswer[sid] = !state.showSectionAnswer[sid];
      renderQuestions();
      break;
    } 
    case 'show-vocab': {
      removeFloatBar();
      const word = el.dataset.word;
      const qid = el.dataset.qid || '';
      const rect = el.getBoundingClientRect();
      showVocabPopover(word, rect.left, rect.bottom + 6, qid);
      break;
    }
    case 'del-vocab-pop': {
      e.stopPropagation();
      const idx = parseInt(el.dataset.idx);
      if (window.ANNOTATIONS.vocab[idx]) {
        window.ANNOTATIONS.vocab.splice(idx, 1);
        scheduleSave();
        closeVocabPopover();
        renderArticle();
        renderQuestions(); // ← 新增：刷新右侧题目
      }
      break;
    }
    case 'jump-to-source':
      jumpToSource(el.dataset.source, el.dataset.word);
      break;    
    case 'search-mode':
      state.searchMode = el.dataset.mode;
      state.searchQuery = '';
      state.searchHighlight = null;
      render();
      break;
    case 'jump-to-article':
      jumpToArticleResult(el.dataset.paper, el.dataset.section, parseInt(el.dataset.passage), el.dataset.keyword);
      break;      
    case 'nav': go(el.dataset.page); break;
    case 'go-back': go('dashboard'); break;
    case 'pick-file': openStoreModal(); break;
    case 'export-data': exportData(); break;
    case 'import-data': document.getElementById('import-file-input').click(); break;
    case 'open-paper': openPaper(el.dataset.paperId); break;
    case 'switch-section': switchSection(el.dataset.sec, parseInt(el.dataset.idx)); break;
    case 'pick-answer': pickAnswer(qid, el.dataset.opt); break;
    case 'toggle-answer': toggleShowAnswer(qid); break;
    case 'toggle-expand': toggleExpand(qid); break;
    case 'toggle-tag-panel': toggleTagPanel(qid); break;
    case 'toggle-opt-tag': toggleOptTagInput(qid, el.dataset.opt); break;
    case 'rm-opt-tag': removeOptTag(qid, el.dataset.opt, el.dataset.tag); break;
    case 'toggle-type': toggleType(qid, el.dataset.tag); break;
    case 'toggle-method': toggleMethod(qid, el.dataset.tag); break;
    case 'rm-my-tag': removeMyTag(qid, el.dataset.tag); break;
    case 'del-loc': delLocation(qid, parseInt(el.dataset.idx)); break;
    case 'jump-para': jumpToPara(parseInt(el.dataset.para)); break;
    case 'jump-q': jumpToQuestion(el.dataset.qid); break;
    case 'add-location': showLocationModal(); break;
    case 'add-vocab': addVocab(); break;
    case 'del-vocab': delVocab(parseInt(el.dataset.idx)); break;
    case 'toggle-vocab': state.vocabShowAll = !state.vocabShowAll; render(); break;
    case 'filter-type': {
      const t = el.dataset.tag;
      const i = state.filterTypes.indexOf(t);
      if (i >= 0) state.filterTypes.splice(i, 1); else state.filterTypes.push(t);
      render(); break;
    }
    case 'filter-method': {
      const m = el.dataset.tag;
      const i = state.filterMethods.indexOf(m);
      if (i >= 0) state.filterMethods.splice(i, 1); else state.filterMethods.push(m);
      render(); break;
    }
    case 'filter-mytag': {
      const t = el.dataset.tag;
      const i = state.filterMyTags.indexOf(t);
      if (i >= 0) state.filterMyTags.splice(i, 1); else state.filterMyTags.push(t);
      render(); break;
    }
    case 'filter-status': state.filterStatus = el.dataset.status; render(); break;
    case 'filter-clear':
      state.filterTypes = []; state.filterMethods = []; state.filterMyTags = [];
      state.filterStatus = 'all'; render(); break;
    case 'jump-to-paper':
      jumpToPaper(el.dataset.paper, el.dataset.section, parseInt(el.dataset.passage));
      break;
    case 'toggle-hide-trans':
      state.hideTranslation = !state.hideTranslation;
      render(); // 重新渲染仪表盘以应用遮罩
      showToast(state.hideTranslation ? '已开启遮挡模式，鼠标悬停查看' : '已显示所有翻译', 'success');
      break;    
  }
});

/* 输入框：实时保存草稿 + 回车提交 */
document.addEventListener('input', e => {
  const target = e.target;
  if (target.matches('[data-opt-tag-input], [data-my-tag-input]')) {
    const key = target.dataset.draftKey;
    if (key) saveDraft(key, target.value);
  }
  if (target.id === 'search-input') {
    state.searchQuery = target.value;
    const mode = state.searchMode || 'vocab';
    const q = target.value.trim().toLowerCase();
    const card = target.closest('.card');
    const container = card && card.querySelector('.search-results');
    const stat = card && card.querySelector('.search-stat');
    if (!container) return;

    if (mode === 'vocab') {
      const vocab = window.ANNOTATIONS.vocab || [];
      const results = q ? vocab.filter(v => {
        const w = (vocabMark(v) + ' ' + vocabDisplay(v)).toLowerCase();
        const m = String(v.meaning || '').toLowerCase();
        return w.includes(q) || m.includes(q);
      }) : vocab;
      container.innerHTML = results.length === 0
        ? (q ? `<div class="empty">没有匹配 "${esc(target.value)}" 的生词</div>` : '<div class="empty">生词本还没有内容</div>')
        : results.map(v => {
            const cls = classifyVocab(vocabDisplay(v));
            return `
              <div class="search-result" data-action="jump-to-source" data-source="${esc(v.source || '')}" data-word="${esc(vocabMark(v))}">
                <div class="sr-main">
                  <div class="sr-word ${cls}">${esc(vocabDisplay(v))}</div>
                  ${v.meaning ? `<div class="sr-meaning">${esc(v.meaning)}</div>` : ''}
                </div>
                <div class="sr-source">${esc(v.source || '')}</div>
              </div>
            `;
          }).join('');
      if (stat) stat.textContent = `共 ${vocab.length} 个 · 匹配 ${results.length} 个`;
    } else {
      const results = q ? searchArticles(q) : [];
      container.innerHTML = !q
        ? '<div class="empty">输入关键词搜索文章内容</div>'
        : (results.length === 0
            ? `<div class="empty">没有匹配 "${esc(target.value)}" 的文章内容</div>`
            : results.map(r => `
                <div class="search-result" data-action="jump-to-article"
                     data-paper="${r.paper.id}" data-section="${r.section.id}"
                     data-passage="${r.passageIndex}" data-keyword="${esc(r.match)}">
                  <div class="sr-main">
                    <div class="sr-title">${esc(r.source)}</div>
                    <div class="sr-context">${formatContext(r.context)}</div>
                  </div>
                </div>
              `).join(''));
      if (stat) stat.textContent = `匹配 ${results.length} 处`;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const target = e.target;
  if (target.matches('[data-opt-tag-input]')) {
    e.preventDefault();
    const val = target.value.trim();
    if (val) addOptTag(target.dataset.qid, target.dataset.opt, val);
  } else if (target.matches('[data-my-tag-input]')) {
    e.preventDefault();
    const val = target.value.trim();
    if (val) addMyTag(target.dataset.qid, val);
  }
});

/* 生词本释义双击编辑 */
/* 生词本双击编辑（支持单词/短语/句子 + 释义） */
document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-vocab-idx]');
  if (!el) return;
  if (el.tagName === 'INPUT') return; // 已经在编辑中
  
  const idx = parseInt(el.dataset.vocabIdx);
  const field = el.dataset.editField || 'meaning';
  const v = window.ANNOTATIONS.vocab[idx];
  if (!v) return;
  
  const current = field === 'display' ? vocabDisplay(v) : (v.meaning || '');
  const input = document.createElement('input');
  input.value = current;
  input.className = field === 'display' ? 'word-input' : 'meaning-input';
  
  const originalClass = el.className;
  const originalTag = el.tagName;
  
  el.replaceWith(input);
  input.focus();
  input.select();

  let finished = false;
  const finish = save => {
    if (finished) return;
    finished = true;
    
    const newVal = input.value.trim();
    if (save) {
      if (field === 'display') {
        v.display = newVal || vocabMark(v); // 如果清空则回退到原词
      } else {
        v.meaning = newVal;
      }
      scheduleSave();
    }
    
    // 局部替换回普通文本（不触发全局 render，不会跳动）
    const finalVal = save ? (newVal || current) : current;
    const node = document.createElement(originalTag);
    node.className = originalClass;
    node.dataset.vocabIdx = idx;
    node.dataset.editField = field;
    node.textContent = finalVal;
    input.replaceWith(node);
    
    // 如果修改了单词导致分类变化（例如从单词变成了短语），才重新渲染归类
    if (save && field === 'display' && classifyVocab(current) !== classifyVocab(finalVal)) {
      // 记录三列的滚动位置
      const tops = [];
      document.querySelectorAll('.vocab-col-content').forEach(c => tops.push(c.scrollTop));
      render();
      // 恢复滚动位置，防止页面跳动
      document.querySelectorAll('.vocab-col-content').forEach((c, i) => {
        if (tops[i] !== undefined) c.scrollTop = tops[i];
      });
    }
  };

  input.onkeydown = ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
    if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
  };
  input.onblur = () => finish(true);
});

document.getElementById('import-file-input').addEventListener('change', e => {
  if (e.target.files[0]) importData(e.target.files[0]);
  e.target.value = '';
});

/* ===== Init ===== */
(async function init() {
  initFontControls();
  render();

  // 1) 已配置 GitHub → 拉取云端标注（手机 / 平板 / 多设备）
  const stored = readStoredGhCfg();
  if (stored && stored.owner && stored.repo && stored.token) {
    await connectGitHub(stored, { remember: true, silent: true });
    return;
  }

  // 2) 本地文件（桌面 Chrome / Edge）
  try {
    const h = await loadHandle();
    if (h) {
      const perm = await h.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        await attachHandle(h, false);
        return;
      }
      // 有句柄但权限未授予：存到 pendingHandle，等用户点按钮再请求
      pendingHandle = h;
      setSaveStatus('disconnected');
      // 延迟一点，等 render 完成
      setTimeout(() => {
        const btn = document.getElementById('fs-status');
        if (btn) {
          btn.textContent = '点击恢复连接';
          btn.style.background = '#fef3c7';
          btn.style.borderColor = '#d97706';
          btn.style.color = '#92400e';
          btn.style.fontWeight = '700';
          btn.style.animation = 'pulse 1.8s ease-in-out infinite';
        }
        // 弹一次 toast
        showToast('上次的标注文件权限已过期，点击右上角按钮恢复连接', 'error');
      }, 300);
      return;
    }
  } catch (e) {}

  // 3) 都没连上：恢复本机暂存的改动，避免刷新后看不见
  try {
    if (localStorage.getItem(LOCAL_CACHE_KEY + '-dirty') === '1') {
      const cached = readLocalCache();
      if (cached && applyAnnotationsObject(cached)) {
        saveBackend = 'none';
        setSaveStatus('local');
        render();
        setTimeout(() => showToast('已恢复本机暂存的改动，尚未写入数据文件', 'error'), 300);
      }
    }
  } catch (e) {}
})();
