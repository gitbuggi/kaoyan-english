<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f97316'/><text x='32' y='46' font-family='sans-serif' font-size='40' font-weight='bold' fill='%23ffffff' text-anchor='middle'>英</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语标注系统</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1e293b;
    --text-sub: #64748b;
    --text-light: #94a3b8;
    --primary: #1e293b;
    --primary-hover: #0f172a;
    --primary-light: #f1f5f9;
    --success: #059669;
    --success-bg: #ecfdf5;
    --success-border: #a7f3d0;
    --danger: #e11d48;
    --danger-bg: #fff1f2;
    --danger-border: #fecdd3;
    --warning: #d97706;
    --warning-bg: #fffbeb;
    --pink: #000000;
    --purple: #7c3aed;
    --cyan: #0284c7;
    --border: #e2e8f0;
    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-md: 0 2px 8px -2px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px -6px rgba(0,0,0,0.1);
    --read-scale: 1;              /* 阅读字号倍率，由右下角 Aa 按钮控制 */
  /* ===== 配色方案：改这里就行 ===== */

  /* 文章里的高亮 */
  --loc-bg: #fef9e7;           /* 定位句背景 */
  --loc-border: #d97706;       /* 定位句下划线 */
  --loc-text: inherit;         /* 定位句文字色 */
  --vocab-weight: 500;         /* 生词加粗程度 */

  /* 生词本三列 */
  --vocab-word: #d97736;          /* 红字 */
  --vocab-phrase: #d9596d;        /* 绿字 */
  --vocab-sentence: #fffbeb;      /* 句子黄底 */

  /* 题型 / 方法 / 我的标签 */
  --tag-type: #7c3aed;         /* 题型 chip */
  --tag-method: #0284c7;       /* 方法 chip */
  --tag-mytag: #7c3aed;        /* 我的标签 chip */
  --tag-opt: #7c3aed;          /* 选项标签 chip */    
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ===== 全局滚动条美化（Webkit 内核：Chrome / Edge / Safari） ===== */
  ::-webkit-scrollbar {
    width: 6px;   /* 垂直滚动条宽度 */
    height: 6px;  /* 水平滚动条高度 */
  }
  ::-webkit-scrollbar-track {
    background: transparent; /* 轨道透明 */
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1; /* 滑块颜色（原有的浅灰蓝） */
    border-radius: 4px;  /* 圆角 */
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8; /* 鼠标悬停时颜色加深 */
  }

  /* ===== 全局滚动条美化（Firefox） ===== */
  * {
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.65;
    -webkit-font-smoothing: antialiased; font-size: 14px;
    display: flex; flex-direction: column;
  }
  ::selection { background: #dbeafe; }

  header {
    height: 52px; flex-shrink: 0;
    background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    z-index: 100; box-shadow: var(--shadow-sm);
  }
  .logo {
    font-size: 15px; font-weight: 700; color: var(--primary);
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  nav { display: flex; gap: 2px; flex-shrink: 0; }
  nav button {
    border: none; background: transparent; padding: 6px 14px; border-radius: 8px;
    font-size: 13px; color: var(--text-sub); cursor: pointer;
    font-family: inherit; font-weight: 500; transition: all .15s;
  }
  nav button:hover { background: var(--primary-light); color: var(--text); }
  nav button.active { background: var(--primary); color: #fff; font-weight: 600; }
  .header-spacer { flex: 1; }
  .header-title {
    font-size: 14px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 300px;
  }
  .header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    border: 1px solid var(--border); background: var(--card); border-radius: 8px;
    cursor: pointer; color: var(--text-sub);
    transition: all .15s; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .icon-btn.on { background: var(--primary-light); color: var(--primary); border-color: var(--text-light); }
  .icon-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.sm { width: 26px; height: 26px; border-radius: 6px; }
  .icon-btn.sm svg { width: 12px; height: 12px; }

  .status-pill {
    padding: 5px 12px; font-size: 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--card); cursor: pointer;
    color: var(--text-sub); font-family: inherit; white-space: nowrap;
    transition: all .15s;
  }
  .status-pill:hover { border-color: var(--primary); color: var(--primary); }
  .status-pill.connected { color: var(--success); border-color: var(--success-border); background: var(--success-bg); }
  .status-pill.saving { color: var(--primary); border-color: var(--text-light); background: var(--primary-light); }
  .status-pill.error { color: var(--danger); border-color: var(--danger-border); background: var(--danger-bg); }
  .status-pill.local { color: var(--warning); border-color: #fde68a; background: var(--warning-bg); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--primary); color: #fff; border: none;
    padding: 7px 16px; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-family: inherit; font-weight: 500;
    transition: all .15s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
  .btn.sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }

  .app { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .page-scroll { flex: 1; overflow-y: auto; padding: 20px; }

  .annotate-layout { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 10px; overflow: hidden; }
  .section-nav {
    width: 110px; flex-shrink: 0; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 0; overflow-y: auto;
  }
  .section-nav .nav-item {
    padding: 8px 12px; font-size: 12.5px; color: var(--text-sub); cursor: pointer;
    border-left: 3px solid transparent; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; transition: all .12s;
  }
  .section-nav .nav-item:hover { background: #f8fafc; color: var(--text); }
  .section-nav .nav-item.active {
    background: var(--primary-light); color: var(--primary);
    border-left-color: var(--primary); font-weight: 600;
  }
  .article-pane {
    flex: 1; min-width: 0; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 28px;
  }
  .q-ref {
    display: inline-block;
    color: var(--primary);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1.5px solid var(--text-sub);
    padding: 0 12px;
    margin: 0 3px;
    text-align: center;
    line-height: 1.2;
    min-width: 32px;
    transition: all .15s;
    vertical-align: baseline;
  }
  .q-ref:hover {
    color: var(--primary-hover);
    border-bottom-color: var(--primary);
    background: var(--primary-light);
    border-radius: 3px 3px 0 0;
  }  
  .article-pane .para { font-size: calc(15.5px * var(--read-scale)); line-height: 1.95; color: #334155; margin-bottom: 14px; }
  .article-pane .para:last-child { margin-bottom: 0; }
  .article-title { font-size: calc(16px * var(--read-scale)); font-weight: 700; margin-bottom: 16px; color: var(--text); }

  /* 定位句：下划线 + 淡黄底 */
  .loc-mark {
    border-bottom: 1.5px solid var(--loc-border);
    cursor: pointer;
    transition: background .12s;
  }
  .loc-mark:hover {  border-bottom-color: #b45309;}
  .loc-mark.flash { animation: flash 1.2s ease; }
  @keyframes flash {
    0%   { background: transparent; }
    30%  { background: #fde68a; }
    60%  { background: #fde68a; }
    100% { background: transparent; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .5; }
  }
  /* 生词 */
.vocab-mark { font-weight: var(--vocab-weight); }
.vocab-mark-word {
  color: var(--vocab-word);
  font-weight: 600;
}
.vocab-mark-word.in-sentence {
  background: var(--vocab-sentence);
  padding: 1px 2px;
  border-radius: 2px;
}

.vocab-mark-phrase {
  color: var(--vocab-phrase);
  font-weight: 600;
}
.vocab-mark-phrase.in-sentence {
  background: var(--vocab-sentence);
  padding: 1px 2px;
  border-radius: 2px;
}

.vocab-mark-sentence {
  background: var(--vocab-sentence);
  padding: 1px 2px;
  border-radius: 1px;
}
  .vocab-mark { cursor: pointer; }
  .vocab-mark { transition: opacity .25s ease; }
  .vocab-mark:hover { opacity: 0.85; }

  /* 生词释义卡片 */
  .vocab-popover {
    position: fixed;
    z-index: 1001;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 24px -6px rgba(0,0,0,0.15);
    border: 1px solid var(--border);
    padding: 12px 14px;
    min-width: 220px;
    max-width: 340px;
  }
  .vocab-popover .vp-word {
    font-size: 15px; font-weight: 500;
    margin-bottom: 8px;
    color: var(--text);
  }
  .vocab-popover .vp-list {
    display: flex; flex-direction: column;
    gap: 6px; margin-bottom: 8px;
  }
  .vocab-popover .vp-item {
    display: flex; align-items: flex-start;
    gap: 8px; font-size: 12.5px; line-height: 1.5;
  }
  .vocab-popover .vp-item .vp-mean {
    flex: 1; color: var(--text-sub);
  }
  .vocab-popover .vp-item .vp-src {
    font-size: 10.5px; color: var(--text-light);
    white-space: nowrap; padding-top: 2px;
  }
  .vocab-popover .vp-item .vp-del {
    cursor: pointer; color: var(--text-light);
    padding: 0 4px; font-size: 14px; line-height: 1;
  }
  .vocab-popover .vp-item .vp-del:hover { color: var(--danger); }
  .vocab-popover .vp-jump {
    display: inline-block;
    padding: 3px 10px; font-size: 11.5px;
    border-radius: 5px; border: 1px solid var(--border);
    background: #fff; color: var(--text-sub);
    cursor: pointer; font-family: inherit;
  }
  .vocab-popover .vp-jump:hover { color: var(--primary); border-color: var(--primary); }
  .questions-pane {
    width: 460px; flex-shrink: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
  }

  .q-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; transition: all .15s;
  }
  .q-card:hover { border-color: var(--border); box-shadow: var(--shadow-sm); }
  .q-card.expanded { border-color: var(--text-light); box-shadow: var(--shadow-md); }
  .q-card.wrong-card { border-left: 3px solid var(--danger); }
  .q-card.done-card  { border-left: 3px solid var(--success); }
  .q-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .q-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; padding: 0 2px;
    color: var(--primary);
    font-size: 15px; font-weight: 700; flex-shrink: 0;
  }
  .q-type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 550; 
    line-height: 1.7;
    color: #2F5E8C;
    background: #EAF0F6;    
    border: 1px solid ;
  }
  .q-stem-text { flex: 1; font-size: calc(14px * var(--read-scale)); font-weight: 500; padding-top: 1px; line-height: 1.5; }
  .q-stem-text.empty { color: var(--text-light); font-style: italic; font-weight: 400; }

  .options-wrap { margin-bottom: 8px; }
  .opt-row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; }
  .opt-key {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text-sub); font-weight: 700; font-size: 12px;
    cursor: pointer; user-select: none; flex-shrink: 0; transition: all .12s;
  }
  .opt-key:hover { border-color: var(--primary); color: var(--primary); }
  .opt-key.picked { background: var(--primary); color: #fff; border-color: var(--primary); }
  .opt-key.correct { background: var(--success); color: #fff; border-color: var(--success); }
  .opt-key.wrong { background: var(--danger); color: #fff; border-color: var(--danger); }
  .opt-text { flex: 1; font-size: calc(13.5px * var(--read-scale)); color: #334155; line-height: 1.55; padding-top: 2px; }

  .opt-tag-btn {
    opacity: 0; width: 22px; height: 22px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent; background: transparent;
    border-radius: 5px; cursor: pointer; color: var(--text-light);
    transition: all .12s; flex-shrink: 0;
  }
  .opt-row:hover .opt-tag-btn { opacity: 1; }
  .opt-tag-btn:hover { color: var(--primary); border-color: var(--border); }
  .opt-tag-btn.on { opacity: 1; color: var(--primary); border-color: var(--text-light); background: var(--primary-light); }
  .opt-tag-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }

  .opt-tags-inline { margin-left: 34px; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .opt-tags-inline:empty { display: none; }
  .ot-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px 2px 10px; font-size: 11px;
    background: var(--tag-mytag); color: #fff; border-radius: 12px;
  }
  .ot-chip .rm {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    cursor: pointer; background: rgba(255,255,255,0.25); font-size: 10px;
  }
  .ot-chip .rm:hover { background: rgba(255,255,255,0.45); }

  .opt-tag-wrap { margin: 2px 0 6px 34px; }
  .opt-tag-wrap input {
    width: 100%; padding: 5px 10px; font-size: 12.5px;
    border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; outline: none; background: #f8fafc;
  }
  .opt-tag-wrap input:focus { border-color: var(--primary); background: #fff; }

  .q-toggle-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); gap: 8px;
  }
  .q-indicators { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ind { font-size: 11.5px; color: var(--text-light); }
  .ind .ind-num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .ind.on { color: var(--primary); }
  .ind.wrong.on { color: var(--danger); }
  .ind.done.on { color: var(--success); }
  .q-toggle-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .tag-input-wrap {
    margin-top: 10px; padding: 10px 12px;
    background: #f8fafc; border: 1px solid var(--border); border-radius: 8px;
  }
  .tag-input-wrap .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .tag-input-wrap .chips:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 6px 3px 11px; font-size: 12px;
    background: var(--purple); color: #fff; border-radius: 12px;
  }
  .chip .rm {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    cursor: pointer; background: rgba(255,255,255,0.25); font-size: 10px;
  }
  .chip .rm:hover { background: rgba(255,255,255,0.45); }
  .tag-input-wrap input {
    width: 100%; padding: 6px 10px; font-size: 12.5px;
    border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; outline: none; background: #fff;
  }
  .tag-input-wrap input:focus { border-color: var(--primary); }

  .loc-panel {
    margin-top: 10px; padding: 10px 12px;
    background: #fffbeb; border-left: 3px solid #d97706; border-radius: 0 8px 8px 0;
  }
  .loc-panel .loc-title {
    font-size: 11.5px; color: #854d0e; font-weight: 600;
    margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
  }
  .loc-item {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 4px 0; font-size: 12.5px; color: #713f12;
  }
  .loc-item .loc-text { flex: 1; cursor: pointer; }
  .loc-item .loc-text:hover { text-decoration: underline; }
  .loc-item .loc-para { font-size: 10.5px; color: #a16207; flex-shrink: 0; padding-top: 2px; }
  .loc-item .loc-del {
    cursor: pointer; color: #a16207; padding: 0 4px; flex-shrink: 0;
    display: inline-flex; align-items: center;
  }
  .loc-item .loc-del:hover { color: var(--danger); }
  .loc-empty { font-size: 12px; color: #a16207; font-style: italic; }

  .tag-area { margin-top: 10px; }
  .tag-section { margin-bottom: 8px; }
  .tag-section-title {
    font-size: 10.5px; color: var(--text-light);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 4px; font-weight: 600;
  }
  .tag-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-chip {
    padding: 3px 10px; font-size: 11.5px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text-sub); cursor: pointer; font-family: inherit;
    transition: all .12s;
  }
  .tag-chip:hover { border-color: var(--primary); color: var(--primary); }
  .tag-chip.type.on { background: var(--tag-type); color: #fff; border-color: var(--tag-type); }
  .tag-chip.method.on { background: var(--tag-method); color: #fff; border-color: var(--tag-method); }

  .dash-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .dash-box {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; border-left: 3px solid var(--primary);
    transition: transform .15s, box-shadow .15s;
  }
  .dash-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .dash-box.wrong { border-left-color: var(--danger); }
  .dash-box.vocab { border-left-color: var(--pink); }
  .dash-box.done { border-left-color: var(--success); }
  .dash-box .num { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.1; letter-spacing: -0.5px; }
  .dash-box.wrong .num { color: var(--danger); }
  .dash-box.vocab .num { color: var(--pink); }
  .dash-box.done .num { color: var(--success); }
  .dash-box .num .suffix { font-size: 14px; color: var(--text-light); font-weight: 400; }
  .dash-box .label { font-size: 11.5px; color: var(--text-sub); margin-top: 6px; letter-spacing: 0.3px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

  .year-chart { display: flex; align-items: flex-end; gap: 8px; padding: 16px 4px 8px; overflow-x: auto; }
  .year-col {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    flex: 1; min-width: 48px; cursor: pointer; padding: 6px 0; border-radius: 8px;
    transition: background .12s;
  }
  .year-col:hover { background: #f8fafc; }
  .year-num { font-size: 13px; font-weight: 700; color: var(--danger); font-variant-numeric: tabular-nums; }
  .year-num.zero { color: #cbd5e1; font-weight: 500; }
  .year-bar-wrap { height: 90px; width: 100%; display: flex; align-items: flex-end; padding: 0 10px; }
  .year-bar { width: 100%; border-radius: 3px 3px 0 0; background: #fda4af; min-height: 3px; transition: height .3s; }
  .year-bar.zero { background: #f1f5f9; }
  .year-label { font-size: 12px; color: var(--text); font-weight: 500; }
  .year-total { font-size: 10px; color: var(--text-light); }

  /* ===== 生词本 ===== */
  .vocab-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  /* 移除外层的高度限制，防止出现双重滚动条 */
  .vocab-list { 
    max-height: none; 
    overflow-y: visible; 
  }
  .vocab-columns {
    display: flex;
    gap: 20px;
    height: 450px;
    align-items: stretch;
  }

  .vocab-col { min-width: 0; display: flex; flex-direction: column; flex: 1; }
  .vocab-col.col-word { flex: 1; }
  .vocab-col.col-phrase { flex: 1.5; }
  .vocab-col.col-sentence { flex: 2; }

  .vocab-col-title {
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .vocab-col-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
  }
  .vocab-col-content::-webkit-scrollbar { width: 4px; }
  .vocab-col-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .vocab-col-content::-webkit-scrollbar-track { background: transparent; }

  /* 卡片：无边框、无圆角、无背景，仅保留极小的垂直间距和一条淡色分隔线 */
  .vocab-col-item {
    display: flex;
    flex-direction: column;
    padding: 6px 4px;
    margin-bottom: 4px;
    background: transparent;
    border: none;
    border-radius: 0;
    border-bottom: 1px solid #f1f5f9;
    flex-shrink: 0;
  }
  .vocab-col-content > .vocab-col-item:last-child { border-bottom: none; }

  .vocab-col-item .word {
    font-size: calc(13.5px * var(--read-scale));
    font-weight: 600;
    color: var(--pink);
    line-height: 1.4;
    word-break: break-word;
  }
  .vocab-col-item .meaning {
    font-size: calc(12.5px * var(--read-scale));
    color: var(--text-sub);
    line-height: 1.4;
    cursor: pointer;
    word-break: break-word;
  }
  .vocab-col-item .item-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .vocab-col-item .source {
    font-size: 10.5px;
    color: var(--text-light);
    white-space: nowrap;
    line-height: 1.2;
  }
  .vocab-col-item .del {
    font-size: 13px;
    line-height: 1;
    color: var(--text-light);
    border: none;
    background: transparent;
    padding: 0 2px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s, color .12s;
    flex-shrink: 0;
  }
  .vocab-col-item:hover .del { opacity: 1; }
  .vocab-col-item .del:hover { color: var(--danger); }

  /* 单词 / 短语：英文 + 翻译 + 来源，同一行，来源右对齐 */
  .vocab-col-item.word-item {
    flex-direction: row;
    align-items: baseline;
    flex-wrap: nowrap;
    gap: 10px;
  }
  .vocab-col-item.word-item .word {
    flex: 0 0 auto;
    white-space: nowrap;
    word-break: normal;
    overflow-wrap: normal;
  }
  .vocab-col-item.word-item .meaning {
    flex: 1 1 auto;
    min-width: 0;
  }
  .vocab-col-item.word-item .item-right { flex: 0 0 auto; }

  /* 句子：英文独占一行；翻译 + 来源在下一行，来源右对齐 */
  .vocab-col-item.sentence-item {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .vocab-col-item.sentence-item .word {
    width: 100%;
    white-space: normal;
    word-break: break-word;
  }
  .vocab-col-item.sentence-item .bottom-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    width: 100%;
  }
  .vocab-col-item.sentence-item .bottom-row .meaning {
    flex: 1 1 auto;
    min-width: 0;
    white-space: normal;
  }
  .vocab-col-item.sentence-item .bottom-row .item-right { flex: 0 0 auto; }

  /* 双击编辑释义时的输入框 */
  .vocab-col-item .meaning-input {
    flex: 1;
    padding: 1px 4px;
    font-size: 12.5px;
    border: 1px solid var(--primary);
    border-radius: 3px;
    font-family: inherit;
    outline: none;
  }
  .paper-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 10px; cursor: pointer; background: var(--card);
    transition: all .15s;
  }
  .paper-item:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .paper-item .meta { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
  .paper-item .arrow { color: var(--text-sub); font-size: 18px; }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filter-group label { font-size: 12px; color: var(--text-sub); font-weight: 600; }

  .stat-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .name { flex: 0 0 130px; font-weight: 500; }
  .stat-bar-wrap { flex: 1; background: #f1f5f9; border-radius: 4px; height: 10px; overflow: hidden; }
  .stat-bar { height: 100%; border-radius: 4px; transition: width .3s; }
  .stat-bar.type { background: var(--purple); }
  .stat-bar.method { background: var(--cyan); }
  .stat-bar.mytag { background: var(--warning); }
  .stat-row .num { flex: 0 0 44px; text-align: right; color: var(--text-sub); font-variant-numeric: tabular-nums; }

  .float-bar {
    position: absolute; z-index: 999;
    display: flex; gap: 4px;
    background: var(--card); padding: 5px; border-radius: 10px;
    box-shadow: var(--shadow-lg); border: 1px solid var(--border);
  }
  .float-bar button {
    width: 32px; height: 32px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 7px; border: none; cursor: pointer; font-family: inherit;
    transition: filter .12s;
  }
  .float-bar button:hover { filter: brightness(0.95); }
  .float-bar button svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; }
  .float-bar .fb-loc { background: #fef3c7; color: #92400e; }
  .float-bar .fb-loc:hover { background: #fde68a; }
  .float-bar .fb-vocab { background: #fce7f3; color: #9d174d; }
  .float-bar .fb-vocab:hover { background: #fbcfe8; }
  /* 触屏设备：加大点按区域 */
  @media (pointer: coarse) {
    .float-bar { padding: 6px; gap: 6px; }
    .float-bar button { width: 44px; height: 44px; border-radius: 9px; }
    .float-bar button svg { width: 18px; height: 18px; }
  }
  /* 关掉 iOS 长按的文字预览/菜单气泡，交给应用自己的浮动条 */
  .article-pane .para, .opt-text, .q-stem-text { -webkit-touch-callout: none; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #1e293b; color: #fff; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; z-index: 1000;
    transition: transform .25s ease; box-shadow: var(--shadow-lg);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 200; display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--card); border-radius: 14px; padding: 24px;
    width: 90%; max-width: 420px; box-shadow: var(--shadow-lg);
  }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .modal .modal-body { margin-bottom: 18px; }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal label.fl { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  .modal .field { margin-bottom: 10px; }
  .modal .field input[type=text], .modal .field input[type=password] {
    width: 100%; padding: 8px 12px; font-size: 13.5px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px; outline: none; box-sizing: border-box;
  }
  .modal .field input:focus { border-color: var(--primary); }
  .modal .row { display: flex; gap: 8px; }
  .modal .row > div { flex: 1; min-width: 0; }
  .modal .hint { font-size: 11.5px; color: var(--text-light); line-height: 1.5; margin-top: 4px; }
  .modal .remember { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-sub); }
  /* ===== Search Page ===== */
  .search-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .search-input {
    flex: 1;
    padding: 10px 16px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    outline: none;
    background: var(--card);
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--primary); }
  .search-stat {
    font-size: 12px; color: var(--text-sub); white-space: nowrap;
  }
  .search-result {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    background: var(--card);
    cursor: pointer;
    transition: all .12s;
  }
  .search-result:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
  .search-result .sr-main { flex: 1; min-width: 0; }
  .search-result .sr-word {
    font-size: 14px; font-weight: 700; line-height: 1.4;
    word-break: break-word;
  }
  .search-result .sr-word.word { color: var(--vocab-word); }
  .search-result .sr-word.phrase { color: var(--vocab-phrase); }
  .search-result .sr-word.sentence { color: var(--vocab-sentence); }
  .search-result .sr-meaning {
    font-size: 12.5px; color: var(--text-sub); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .search-result .sr-source {
    font-size: 11.5px; color: var(--text-light); white-space: nowrap;
    padding-top: 3px; flex-shrink: 0;
  }
  .search-tabs {
    display: flex; gap: 4px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .search-tab {
    padding: 8px 18px; font-size: 13px; font-family: inherit;
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-sub); cursor: pointer; font-weight: 500;
    margin-bottom: -1px;
  }
  .search-tab:hover { color: var(--text); }
  .search-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .search-result .sr-context {
    font-size: 13px; color: #334155; line-height: 1.6;
    margin-top: 4px; word-break: break-word;
  }
  .search-result .sr-context em {
    font-style: normal; background: #fde68a; padding: 1px 2px; border-radius: 2px;
  }
  .search-result .sr-title {
    font-size: 11.5px; color: var(--text-light); margin-top: 4px;
  }
  .search-hit {
    background: #fde68a;
    border-bottom: 2px solid #d97706;
    padding: 1px 0;
    scroll-margin-top: 100px;
  }  
  .empty { text-align: center; padding: 40px 20px; color: var(--text-light); font-size: 13px; }

  /* ===== 阅读字号控制（右下角 Aa） ===== */
  .fs-fab {
    position: fixed; right: 14px; bottom: 16px; z-index: 120;
    width: 42px; height: 42px; border-radius: 50%; padding: 0;
    border: 1px solid var(--border); background: var(--card); color: var(--text-sub);
    font-family: Georgia, "Times New Roman", serif; font-size: 16px; font-weight: 700;
    line-height: 1; cursor: pointer; box-shadow: var(--shadow-md);
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .fs-fab:hover, .fs-fab.on { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .fs-panel {
    position: fixed; right: 14px; bottom: 68px; z-index: 121; width: 208px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 12px;
  }
  .fs-panel .fs-row { display: flex; align-items: center; gap: 8px; }
  .fs-panel .fs-btn {
    height: 32px; border: 1px solid var(--border); background: var(--card);
    border-radius: 8px; color: var(--text); font-family: inherit;
    font-size: 14px; font-weight: 700; line-height: 1; cursor: pointer; transition: all .15s;
  }
  .fs-panel .fs-btn:hover { border-color: var(--primary); color: var(--primary); }
  .fs-panel .fs-btn[data-fs="dec"], .fs-panel .fs-btn[data-fs="inc"] { width: 44px; flex-shrink: 0; }
  .fs-panel .fs-val {
    flex: 1; text-align: center; font-size: 13px; color: var(--text-sub);
    font-variant-numeric: tabular-nums;
  }
  .fs-panel .fs-reset { width: 100%; margin-top: 8px; height: 28px; font-size: 12px; font-weight: 500; }
  .fs-panel .fs-hint { font-size: 11px; color: var(--text-light); margin-top: 8px; line-height: 1.45; }

  @media (max-width: 1000px) {
    .annotate-layout { flex-direction: column; overflow-y: auto; }
    .section-nav { width: 100%; display: flex; overflow-x: auto; padding: 0; }
    .section-nav .nav-item {
      flex-shrink: 0; border-left: none;
      border-bottom: 3px solid transparent; padding: 10px 14px;
    }
    .section-nav .nav-item.active { border-left: none; border-bottom-color: var(--primary); }
    .article-pane, .questions-pane { width: 100%; max-height: none; flex: none; }
    .questions-pane { width: 100%; }
  }
  /* 编辑单词/短语时的输入框 */
  .vocab-col-item .word-input {
    flex: 1;
    min-width: 0;
    padding: 1px 4px;
    font-size: 14px;
    font-weight: 600;
    color: var(--pink);
    border: 1px solid var(--primary);
    border-radius: 3px;
    font-family: inherit;
    outline: none;
    background: #fff;
    box-sizing: border-box;
  }
  .vocab-col-item.word-item .word-input {
    width: 100%;
    flex: 1;
  }
  /* ===== 隐藏翻译功能 ===== */
  .vocab-col-content.hide-trans .meaning {
    color: transparent !important;
    background: #e2e8f0; /* 灰色遮罩 */
    border-radius: 4px;
    padding: 0 4px;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
  }
  
  /* 鼠标悬停时显示，方便临时看一眼 */
  .vocab-col-content.hide-trans .meaning:hover {
    color: var(--text-sub) !important;
    background: transparent;
  }

  /* 双击编辑时，输入框必须是正常的，不能是透明的 */
  .vocab-col-content.hide-trans .meaning-input {
    background: #fff;
  }  
</style>

<body>

<script>
'use strict';

window.EXAM_DATA = window.EXAM_DATA || { papers: [] };

const ICONS = {
  eye: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
  tag: '<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  bookmark: '<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
};

const DEFAULT_TAG_DEFS = {
  types: ['细节题', '推断题', '主旨题', '词义猜测', '态度题', '例证题', '指代题'],
  methods: ['定位法', '同义替换', '排除法', '反推法', '主旨归纳', '上下文推断']
};

window.ANNOTATIONS = window.ANNOTATIONS || {};
if (!window.ANNOTATIONS.tagDefs) window.ANNOTATIONS.tagDefs = DEFAULT_TAG_DEFS;
if (!window.ANNOTATIONS.questions) window.ANNOTATIONS.questions = {};
if (!window.ANNOTATIONS.vocab) window.ANNOTATIONS.vocab = [];
if (!window.ANNOTATIONS.customTags) window.ANNOTATIONS.customTags = [];

const state = {
  page: 'dashboard',
  paperId: null,
  sectionId: null,
  passageIndex: 0,
  expanded: {},
  showAnswer: {},
  showSectionAnswer: {},   // 按 section 记录是否显示全部答案  
  optTagOpen: {},
  tagPanel: {},
  filterTypes: [],
  filterMethods: [],
  filterMyTags: [],
  filterStatus: 'all',
  selectedText: '',
  selectedPara: 0,
  vocabShowAll: false,
  inputDrafts: {},   // 输入框草稿 { draftKey: value } 
  searchMode: 'vocab',         // 'vocab' | 'article'
  searchQuery: '',
  searchHighlight: null,        // 跳转后临时高亮 { text, paperId, sectionId, passageIndex }
  hideTranslation: false,
};

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function classifyVocab(text) {
  const t = String(text || '').trim();
  if (!t) return 'word';
  // 含句末标点 → 句子
  if (/[.?!。？！]/.test(t)) return 'sentence';
  // 按词数判断
  const words = t.split(/\s+/).filter(Boolean);
  if (words.length >= 8) return 'sentence';   // 8 个词以上也算句子
  if (words.length >= 2) return 'phrase';
  return 'word';
}
function showToast(msg, type = '') {
  let t = document.querySelector('.toast');
  if (!t) {
    t = document.createElement('div');
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveDraft(key, val) {

function getCurrentPaper() {

function getCurrentSection() {

function annKey(paper, qid) { return paper.year + '-' + qid; }

function getAnn(paper, qid) {

  if (!window.ANNOTATIONS.questions[key]) {

function getAllQuestionsInSection(section) {

/* ===== 标注存储层：GitHub 仓库 / 本地文件 / 浏览器缓存 ===== */
const HANDLE_DB = 'kaoyan-fs', HANDLE_STORE = 'handles', HANDLE_KEY = 'annotationsFile';
const GH_CFG_KEY = 'kaoyan-gh-config', LOCAL_CACHE_KEY = 'kaoyan-annotations-cache';
let fileHandle = null, pendingHandle = null, saveTimer = null, saveStatus = 'disconnected';
let warnedNoFile = false;
let ghCfg = null, ghSha = null, ghBusy = false, ghQueued = false, ghLastPushed = null;
let saveBackend = 'none';   // 'gh' | 'fs' | 'none'

function openHandleDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(HANDLE_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(HANDLE_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function saveHandle(h) {
  const db = await openHandleDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(HANDLE_STORE, 'readwrite');
    tx.objectStore(HANDLE_STORE).put(h, HANDLE_KEY);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function loadHandle() {
  try {
    const db = await openHandleDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(HANDLE_STORE, 'readonly');
      const r = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  } catch (e) { return null; }
}

async function pickFile() {
  if (!window.showOpenFilePicker) {
    showToast('请用 Chrome 或 Edge', 'error');
    return;
  }

  // 1) 有 pending 句柄（上次未授权）→ 只请求权限，不弹选择器
  if (pendingHandle) {
    try {
      const perm = await pendingHandle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        const h = pendingHandle;
        pendingHandle = null;
        await saveHandle(h);
        await attachHandle(h, false);
        showToast('已恢复连接', 'success');
        return;
      }
    } catch (e) {
      console.warn('pending 句柄失效', e);
      pendingHandle = null;
    }
  }

  // 2) 有旧句柄 → 请求权限
  if (fileHandle) {
    try {
      const perm = await fileHandle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        await attachHandle(fileHandle, false);
        showToast('已恢复连接', 'success');
        return;
      }
    } catch (e) {
      console.warn('旧句柄失效', e);
      fileHandle = null;
    }
  }

  // 3) 没有句柄 → 才弹选择器
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: '标注文件', accept: { 'text/javascript': ['.js'] } }],
      multiple: false
    });
    await saveHandle(handle);
    await attachHandle(handle, true);
  } catch (e) {}
}

async function attachHandle(handle, request) {
  fileHandle = handle;
  const opts = { mode: 'readwrite' };
  let perm = await handle.queryPermission(opts);
  if (perm !== 'granted' && request) perm = await handle.requestPermission(opts);
  if (perm !== 'granted') { setSaveStatus('disconnected'); return; }
  await readFromHandle();
  saveBackend = 'fs';
  markDirty(false);
  setSaveStatus('connected');
  render();
  showToast('已连接标注文件', 'success');
}

async function readFromHandle() {
  if (!fileHandle) return;
  try {
    const file = await fileHandle.getFile();
    const text = await file.text();
    const obj = parseAnnotationsText(text);
    if (obj) { applyAnnotationsObject(obj); cacheLocal(); }
  } catch (e) { console.error('读取失败', e); showToast('读取文件失败', 'error'); }
}

function scheduleSave() {
  cacheLocal();
  markDirty(true);

  if (saveBackend === 'gh') {
    if (saveTimer) clearTimeout(saveTimer);
    setSaveStatus('saving');
    saveTimer = setTimeout(ghSaveNow, 2000);
    return;
  }

  if (saveBackend === 'fs' && fileHandle) {
    if (saveTimer) clearTimeout(saveTimer);
    setSaveStatus('saving');
    saveTimer = setTimeout(writeToHandle, 400);
    return;
  }

  setSaveStatus('local');
  if (!warnedNoFile) {
    showToast('未连接数据文件，改动暂存在本机浏览器', 'error');
    warnedNoFile = true;
    setTimeout(() => { warnedNoFile = false; }, 8000);
  }
}

async function writeToHandle() {
  if (!fileHandle) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(annotationsSource());
    await w.close();
    cacheLocal();
    markDirty(false);
    setSaveStatus('connected');
  } catch (e) { console.error(e); setSaveStatus('error'); showToast('保存失败', 'error'); }
}

/* ===== 阅读字号 ===== */
const FONT_SCALE_KEY = 'kaoyan-font-scale';
const FONT_STEPS = [0.8, 0.9, 1.0, 1.15, 1.3, 1.45, 1.6];
let fontScale = 1;

function fontStepIndex() {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < FONT_STEPS.length; i++) {
    const d = Math.abs(FONT_STEPS[i] - fontScale);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

function applyFontScale(v) {
  v = Math.min(2, Math.max(0.7, v || 1));
  fontScale = v;
  document.documentElement.style.setProperty('--read-scale', String(v));
  try { localStorage.setItem(FONT_SCALE_KEY, String(v)); } catch (e) {}
  const val = document.getElementById('fs-val');
  if (val) val.textContent = Math.round(v * 100) + '%';
}

function initFontControls() {
  let saved = 1;
  try {
    const s = parseFloat(localStorage.getItem(FONT_SCALE_KEY));
    if (isFinite(s) && s >= 0.7 && s <= 2) saved = s;
  } catch (e) {}
  applyFontScale(saved);

  const fab = document.createElement('button');
  fab.type = 'button';
  fab.id = 'fs-fab';
  fab.className = 'fs-fab';
  fab.textContent = 'Aa';
  fab.title = '阅读字号';
  document.body.appendChild(fab);

  const panel = document.createElement('div');
  panel.id = 'fs-panel';
  panel.className = 'fs-panel';
  panel.style.display = 'none';
  panel.innerHTML =
    '<div class="fs-row">' +
      '<button type="button" class="fs-btn" data-fs="dec">A−</button>' +
      '<span class="fs-val" id="fs-val">100%</span>' +
      '<button type="button" class="fs-btn" data-fs="inc">A+</button>' +
    '</div>' +
    '<button type="button" class="fs-btn fs-reset" data-fs="reset">恢复默认</button>' +
    '<div class="fs-hint">只影响正文、题目和生词本，设置保存在本机。</div>';
  document.body.appendChild(panel);

  function showPanel(show) {
    panel.style.display = show ? 'block' : 'none';
    fab.classList.toggle('on', show);
  }

  fab.addEventListener('click', e => {
    e.stopPropagation();
    showPanel(panel.style.display === 'none');
  });
  panel.addEventListener('click', e => {
    e.stopPropagation();
    const btn = e.target.closest('[data-fs]');
    if (!btn) return;
    const act = btn.dataset.fs;
    const i = fontStepIndex();
    if (act === 'inc') applyFontScale(FONT_STEPS[Math.min(FONT_STEPS.length - 1, i + 1)]);
    else if (act === 'dec') applyFontScale(FONT_STEPS[Math.max(0, i - 1)]);
    else applyFontScale(1);
  });
  document.addEventListener('click', () => showPanel(false));
  applyFontScale(fontScale);
}

/* ===== 序列化 / 解析 / 本机缓存 ===== */
function annotationsSource() {
  return '// 考研英语标注文件 - 自动维护\n\nwindow.ANNOTATIONS = ' +
    JSON.stringify(window.ANNOTATIONS, null, 2) + ';\n';
}

function parseAnnotationsText(text) {
  const idx = text.indexOf('window.ANNOTATIONS');
  if (idx === -1) return null;
  const eq = text.indexOf('=', idx);
  if (eq === -1) return null;
  const rest = text.slice(eq + 1).trim().replace(/;+\s*$/, '');
  try { return JSON.parse(rest); } catch (e) { console.error('标注解析失败', e); return null; }
}

function applyAnnotationsObject(obj) {
  if (!obj || typeof obj !== 'object') return false;
  window.ANNOTATIONS = {
    tagDefs: obj.tagDefs || DEFAULT_TAG_DEFS,
    questions: obj.questions || {},
    vocab: obj.vocab || [],
    customTags: obj.customTags || []
  };
  updateDatalist();
  return true;
}

function cacheLocal() {
  try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(window.ANNOTATIONS)); } catch (e) {}
}
function markDirty(v) {
  try {
    if (v) localStorage.setItem(LOCAL_CACHE_KEY + '-dirty', '1');
    else localStorage.removeItem(LOCAL_CACHE_KEY + '-dirty');
  } catch (e) {}
}
function readLocalCache() {
  try {
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

/* ===== GitHub 仓库后端（手机 / 平板可用） ===== */
function ghHeaders() {
  return {
    'Authorization': 'Bearer ' + ghCfg.token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
function ghFileUrl() {
  return 'https://api.github.com/repos/' + ghCfg.owner + '/' + ghCfg.repo +
         '/contents/' + ghCfg.path.split('/').map(encodeURIComponent).join('/');
}
async function ghErrorText(res) {
  try {
    const j = await res.json();
    if (j && j.message) return j.message;
  } catch (e) {}
  return 'HTTP ' + res.status;
}
function b64ToUtf8(b64) {
  const bin = atob(String(b64).replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

async function ghLoad() {
  const url = ghFileUrl() + '?ref=' + encodeURIComponent(ghCfg.branch) + '&_=' + Date.now();
  const res = await fetch(url, { headers: ghHeaders(), cache: 'no-store' });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(await ghErrorText(res));
  const j = await res.json();
  return { sha: j.sha, text: j.content ? b64ToUtf8(j.content) : '' };
}

async function ghCreate(text) {
  const res = await fetch(ghFileUrl(), {
    method: 'PUT',
    headers: ghHeaders(),
    body: JSON.stringify({
      message: '创建 annotations.js',
      content: utf8ToB64(text),
      branch: ghCfg.branch
    })
  });
  if (!res.ok) throw new Error(await ghErrorText(res));
  const j = await res.json();
  return j && j.content ? j.content.sha : null;
}

async function ghPut(text) {
  const payload = {
    message: '更新标注 ' + new Date().toLocaleString('zh-CN', { hour12: false }),
    content: utf8ToB64(text),
    branch: ghCfg.branch
  };
  if (ghSha) payload.sha = ghSha;
  let res = await fetch(ghFileUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(payload) });
  if (res.status === 409 || res.status === 422) {
    // sha 变了（别的设备改过）→ 重新取一次再写
    const cur = await ghLoad();
    ghSha = cur ? cur.sha : null;
    if (ghSha) payload.sha = ghSha; else delete payload.sha;
    res = await fetch(ghFileUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(payload) });
  }
  if (!res.ok) throw new Error(await ghErrorText(res));
  const j = await res.json();
  return j && j.content ? j.content.sha : null;
}

async function ghSaveNow() {
  if (!ghCfg || saveBackend !== 'gh') return;
  if (ghBusy) { ghQueued = true; return; }
  const text = annotationsSource();
  if (text === ghLastPushed) { setSaveStatus('connected'); markDirty(false); return; }
  ghBusy = true;
  setSaveStatus('saving');
  try {
    const sha = await ghPut(text);
    if (sha) ghSha = sha;
    ghLastPushed = text;
    cacheLocal();
    markDirty(false);
    setSaveStatus('connected');
  } catch (e) {
    console.error('GitHub 保存失败', e);
    setSaveStatus('error');
    showToast('云端保存失败：' + e.message, 'error');
  } finally {
    ghBusy = false;
    if (ghQueued) { ghQueued = false; setTimeout(ghSaveNow, 400); }
  }
}

async function connectGitHub(cfg, opts) {
  opts = opts || {};
  ghCfg = cfg;
  saveBackend = 'gh';
  if (opts.remember !== false) {
    try { localStorage.setItem(GH_CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  } else {
    try { localStorage.removeItem(GH_CFG_KEY); } catch (e) {}
  }
  setSaveStatus('saving');
  let ok = true;
  try {
    const file = await ghLoad();
    let dirty = false;
    try { dirty = localStorage.getItem(LOCAL_CACHE_KEY + '-dirty') === '1'; } catch (e) {}
    if (file && dirty && !opts.silent) {
      const pushLocal = confirm('本机有尚未写入文件的改动。\n\n确定 = 用本机版本覆盖云端\n取消 = 放弃本机改动，改用云端版本');
      if (pushLocal) {
        ghSha = file.sha;
        const sha = await ghPut(annotationsSource());
        if (sha) ghSha = sha;
        ghLastPushed = annotationsSource();
      } else {
        ghSha = file.sha;
        const obj = parseAnnotationsText(file.text);
        if (obj) { applyAnnotationsObject(obj); cacheLocal(); }
        ghLastPushed = annotationsSource();
      }
    } else if (file) {
      ghSha = file.sha;
      const obj = parseAnnotationsText(file.text);
      if (obj) { applyAnnotationsObject(obj); cacheLocal(); }
      ghLastPushed = annotationsSource();
    } else {
      ghSha = await ghCreate(annotationsSource());
      ghLastPushed = annotationsSource();
    }
    markDirty(false);
    setSaveStatus('connected');
    render();
    if (!opts.silent) showToast('已连接 GitHub，改动会自动保存', 'success');
  } catch (e) {
    ok = false;
    console.error('GitHub 连接失败', e);
    if (!opts.silent) {
      // 手动连接失败：退回本机模式，避免后续保存一直报错
      saveBackend = 'none';
      ghCfg = null;
      ghSha = null;
      setSaveStatus('local');
    } else {
      setSaveStatus('error');
    }
    if (!opts.silent) showToast('连接失败：' + e.message, 'error');
  }
  return ok;
}

function readStoredGhCfg() {
  try {
    const raw = localStorage.getItem(GH_CFG_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function disconnectGitHub() {
  try { localStorage.removeItem(GH_CFG_KEY); } catch (e) {}
  ghCfg = null; ghSha = null; ghBusy = false; ghQueued = false; ghLastPushed = null;
  saveBackend = 'none';
  setSaveStatus('disconnected');
  showToast('已断开 GitHub 连接', 'success');
}

function guessRepoFromLocation() {
  const host = location.hostname || '';
  const seg = (location.pathname || '').split('/').filter(Boolean);
  if (/\.github\.io$/i.test(host) && seg.length) {
    return { owner: host.split('.')[0], repo: seg[0] };
  }
  return { owner: '', repo: '' };
}

}

function exportData() {
  const data = JSON.stringify(window.ANNOTATIONS, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kaoyan-annotations-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出备份文件', 'success');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (obj && typeof obj === 'object') {
        window.ANNOTATIONS = {
          tagDefs: obj.tagDefs || DEFAULT_TAG_DEFS,
          questions: obj.questions || {},
          vocab: obj.vocab || [],
          customTags: obj.customTags || []
        };
        updateDatalist();
        scheduleSave();
        render();
        showToast('导入成功', 'success');
      }
    } catch (err) {
      showToast('导入失败：文件格式错误', 'error');
    }
  };
  reader.readAsText(file);
}

function renderDashboard() {
  const papers = window.EXAM_DATA.papers || [];
  const yearStats = [];

  papers.forEach(p => {
    let yTotal = 0, yWrong = 0;
    (p.sections || []).forEach(s => {
      const allQ = [];
      if (s.questions) allQ.push(...s.questions);
      (s.passages || []).forEach(ps => { if (ps.questions) allQ.push(...ps.questions); });
      allQ.forEach(q => {
        yTotal++;
        const ann = window.ANNOTATIONS.questions[annKey(p, q.id)];
        if (ann && ann.wrong) {
          yWrong++;
        }
      });
    });
    yearStats.push({ year: p.year, title: p.title, total: yTotal, wrong: yWrong, paperId: p.id });
  });
  yearStats.sort((a, b) => a.year - b.year);

  const vocab = window.ANNOTATIONS.vocab || [];
  const maxWrong = Math.max(1, ...yearStats.map(s => s.wrong));
  const chartHtml = yearStats.map(s => {
    const h = s.wrong === 0 ? 0 : (s.wrong / maxWrong * 100);
    const isZero = s.wrong === 0;
    return `
      <div class="year-col" data-action="open-paper" data-paper-id="${s.paperId}">
        <div class="year-num ${isZero ? 'zero' : ''}">${s.wrong}</div>
        <div class="year-bar-wrap">
          <div class="year-bar ${isZero ? 'zero' : ''}" style="height:${h}%"></div>
        </div>
        <div class="year-label">${s.year}</div>
        <div class="year-total">共 ${s.total} 题</div>
      </div>
    `;
  }).join('');

  const groups = { word: [], phrase: [], sentence: [] };
  vocab.forEach(v => {
    const realIdx = vocab.indexOf(v);
    groups[classifyVocab(vocabDisplay(v))].push({ v, realIdx });
  });

  const renderCol = (label, list, cls) => {
    if (!list.length) return '';
    
    const isSentence = cls === 'col-sentence';
    // 【关键】根据开关状态生成类名
    const hideClass = state.hideTranslation ? ' hide-trans' : '';

    return `
      <div class="vocab-col ${cls}">
        <div class="vocab-col-title">${label} <span class="count">${list.length}</span></div>
        <!-- 【关键】把 hideClass 拼在 class 里面 -->
        <div class="vocab-col-content${hideClass}">
          ${list.map(({v, realIdx}) => {
            const display = esc(vocabDisplay(v));
            const meaning = esc(v.meaning || '— 点击编辑 —');
            const source = esc(v.source || '');

            if (isSentence) {
              return `
                <div class="vocab-col-item sentence-item">
                  <div class="word" data-vocab-idx="${realIdx}" data-edit-field="display">${display}</div>
                  <div class="bottom-row">
                    <span class="meaning" data-vocab-idx="${realIdx}" data-edit-field="meaning">${meaning}</span>
                    <div class="item-right">
                      <span class="source">${source}</span>
                      <button class="del" data-action="del-vocab" data-idx="${realIdx}" title="删除">×</button>
                    </div>
                  </div>
                </div>
              `;
            } else {
              return `
                <div class="vocab-col-item word-item">
                  <span class="word" data-vocab-idx="${realIdx}" data-edit-field="display">${display}</span>
                  <span class="meaning" data-vocab-idx="${realIdx}" data-edit-field="meaning">${meaning}</span>
                  <div class="item-right">
                    <span class="source">${source}</span>
                    <button class="del" data-action="del-vocab" data-idx="${realIdx}" title="删除">×</button>
                  </div>
                </div>
              `;
            }
          }).join('')}
        </div>
      </div>
    `;
  };

  const cols = [
    renderCol('单词', groups.word, 'col-word'),
    renderCol('短语', groups.phrase, 'col-phrase'),
    renderCol('句子', groups.sentence, 'col-sentence')
  ].filter(Boolean).join('');

  const vocabHtml = `<div class="vocab-columns">${cols}</div>`;

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h2 style="margin:0;">每年错题分布</h2>

function normalizeKeepLength(s) {
  return String(s || '').replace(/[\r\n\t\u00A0\u2009\u202F]/g, ' ');
}

function renderArticle() {
  const section = getCurrentSection();
  const pane = document.getElementById('article-pane');
  if (!section) { pane.innerHTML = ''; return; }
  const paper = getCurrentPaper();
  let content = '', title = '';
  if (section.id === 'reading-a') {
    const p = (section.passages || [])[state.passageIndex];
    content = p ? (p.content || '') : '';
    title = p ? (p.title || '') : '';
  } else {
    content = section.content || '';
    title = section.name || '';
  }

  const qs = getAllQuestionsInSection(section);
  const marks = [];
  qs.forEach(q => {
    const ann = getAnn(paper, q.id);
    (ann.locations || []).forEach((l, i) => {
      marks.push({ text: l.text, para: l.para, qid: q.id, idx: i, type: 'loc' });
    });
  });
(window.ANNOTATIONS.vocab || []).forEach((v, i) => {
  const m = vocabMark(v);
  // 只处理文章里标的生词（旧数据没 target 的默认当 article 处理）
  if (m && v.source === getSourceLabel() && v.target !== 'question') {
    marks.push({ text: m, para: v.para || 0, offset: v.offset, context: v.context, idx: i, type: 'vocab' });
  }
});

  const searchKeyword = (
    state.searchHighlight &&
    state.searchHighlight.paperId === paper.id &&
    state.searchHighlight.sectionId === section.id &&
    state.searchHighlight.passageIndex === state.passageIndex
  ) ? state.searchHighlight.text : null;

  const paras = content.split(/\n\n+/);
  const html = paras.map((pRaw, i) => {
    const paraNum = i + 1;
    const p = normalizeKeepLength(pRaw);

    // [[N]] 填空
    const clozeRanges = [];
    const clozeRe = /\[\[(\d+)\]\]/g;
    let cm;
    while ((cm = clozeRe.exec(p)) !== null) {
      clozeRanges.push({
        start: cm.index,
        end: cm.index + cm[0].length,
        num: cm[1]
      });
    }

    // loc / vocab 范围（允许互相重叠）
    const locRanges = [];
    const vocabRanges = [];
    marks.forEach(m => {
      if (!m.text) return;
      
      // 如果是定位句，或者生词存了段落号(非0)，且与当前段不符，就跳过
      if ((m.type === 'loc' || m.type === 'vocab') && m.para && m.para !== paraNum) return;
      
      const needle = normalizeKeepLength(m.text);
      if (!needle) return;
      let from = 0;
      while (true) {
        const idx = p.indexOf(needle, from);
        if (idx === -1) break;
        
        let isMatch = true;
        // 新逻辑：如果是生词且存了 context，用 context 验证是不是当初选中的那一个
        if (m.type === 'vocab' && m.context) {
          // 获取前后各 40 个字符
          const leftStr = p.slice(Math.max(0, idx - 40), idx);
          const rightStr = p.slice(idx + needle.length, idx + needle.length + 40);
          
          // 【核心修改】：过滤掉所有非英文字母！
          const cleanLeft = leftStr.replace(/[^A-Za-z]/g, '').toLowerCase();
          const cleanRight = rightStr.replace(/[^A-Za-z]/g, '').toLowerCase();
          const expectLeft = (m.context.left || '').replace(/[^A-Za-z]/g, '').toLowerCase();
          const expectRight = (m.context.right || '').replace(/[^A-Za-z]/g, '').toLowerCase();

          // 比对纯字母序列
          const leftOk = !expectLeft || cleanLeft.endsWith(expectLeft);
          const rightOk = !expectRight || cleanRight.startsWith(expectRight);

          if (!leftOk || !rightOk) {
            isMatch = false;
          }
        }
        
        if (!isMatch) {
          from = idx + 1;
          continue;
        }

        const r = { start: idx, end: idx + needle.length, mark: m };
        if (clozeRanges.some(c => !(r.end <= c.start || r.start >= c.end))) {
          from = idx + 1;
          continue;
        }
        
        if (m.type === 'loc') locRanges.push(r);
        else vocabRanges.push(r);
        
        // 只要匹配上了，或者旧数据没有 context，就只亮这一处
        break;
      }
    });

    // 搜索范围
    const searchRanges = [];
    if (searchKeyword) {
      let from = 0;
      while (true) {
        const idx = p.indexOf(searchKeyword, from);
        if (idx === -1) break;
        searchRanges.push({ start: idx, end: idx + searchKeyword.length });
        from = idx + searchKeyword.length;
      }
    }

    // 合并边界
    const boundaries = new Set([0, p.length]);
    clozeRanges.forEach(r => { boundaries.add(r.start); boundaries.add(r.end); });
    locRanges.forEach(r => { boundaries.add(r.start); boundaries.add(r.end); });
    vocabRanges.forEach(r => { boundaries.add(r.start); boundaries.add(r.end); });
    searchRanges.forEach(r => { boundaries.add(r.start); boundaries.add(r.end); });
    const sorted = [...boundaries].filter(b => b >= 0 && b <= p.length).sort((a, b) => a - b);

    function pickShortest(list, s, e) {
      let best = null, bestLen = Infinity;
      for (const r of list) {
        if (s >= r.start && e <= r.end) {
          const len = r.end - r.start;
          if (len < bestLen) { bestLen = len; best = r; }
        }
      }
      return best;
    }

    let out = '';
    for (let k = 0; k < sorted.length - 1; k++) {
      const s = sorted[k], e = sorted[k + 1];
      if (s >= e) continue;
      const inner = esc(p.slice(s, e));

      const cloze = clozeRanges.find(r => s >= r.start && e <= r.end);
      if (cloze) {
        out += `<span class="q-ref" data-action="jump-q" data-qid="q${cloze.num}">${cloze.num}</span>`;
        continue;
      }

      const loc = pickShortest(locRanges, s, e);
      const vocabMark = pickShortest(vocabRanges, s, e);
      const isSearch = searchRanges.some(r => s >= r.start && e <= r.end);

      const vocabType = vocabMark ? classifyVocab(vocabMark.mark.text) : '';
      // 判断当前碎片是否落在某个"句子"范围内
      const inSentenceRange = vocabRanges.some(r => {
        if (classifyVocab(r.mark.text) !== 'sentence') return false;
        return s >= r.start && e <= r.end;
      });
      let extraCls = '';
      if ((vocabType === 'word' || vocabType === 'phrase') && inSentenceRange) {
        extraCls = ' in-sentence';   // 只在句子里时才继承背景
      }
      const vocabCls = vocabType
        ? ('vocab-mark vocab-mark-' + vocabType + extraCls)
        : '';

      let chunk = inner;
      if (vocabMark && loc) {
        chunk = `<span class="${vocabCls} loc-mark" data-action="show-vocab" data-word="${esc(vocabMark.mark.text)}" data-qid="${loc.mark.qid}">${inner}</span>`;
      } else if (vocabMark) {
        chunk = `<span class="${vocabCls}" data-action="show-vocab" data-word="${esc(vocabMark.mark.text)}">${inner}</span>`;
      } else if (loc) {
        chunk = `<span class="loc-mark" data-action="jump-q" data-qid="${loc.mark.qid}">${inner}</span>`;
      }

      if (isSearch) {
        chunk = `<mark class="search-hit">${chunk}</mark>`;
      }
      out += chunk;
    }

    return `<p class="para" data-para="${paraNum}">${out}</p>`;
  }).join('');

  pane.innerHTML = (title ? `<div class="article-title">${esc(title)}</div>` : '') +
    (html || '<div class="empty">无内容</div>');
}
let vocabPopoverEl = null;

function closeVocabPopover() {
  if (vocabPopoverEl) { vocabPopoverEl.remove(); vocabPopoverEl = null; }
}

function showVocabPopover(word, x, y, qid) {
  closeVocabPopover();
  const vocab = window.ANNOTATIONS.vocab || [];
  
  // 1. 先找出当前点击的这个词（mark）对应的记录
  const currentMarks = vocab.filter(v => vocabMark(v).toLowerCase() === word.toLowerCase());
  if (!currentMarks.length) return;

  // 2. 提取出这些记录所属的 display（忽略大小写），作为统一标识
  const targetDisplays = new Set(currentMarks.map(v => vocabDisplay(v).toLowerCase()));

  // 3. 在整个生词本中，寻找所有 display 属于上述集合的记录
  const items = vocab.filter(v => targetDisplays.has(vocabDisplay(v).toLowerCase()));

  // 4. 按 display 分组，把相同展示词的记录聚在一起
  const groups = {};
  items.forEach(v => {
    const d = vocabDisplay(v);
    if (!groups[d]) groups[d] = [];
    groups[d].push(v);
  });

  const el = document.createElement('div');
  el.className = 'vocab-popover';

  let listHtml = '';
  for (const [displayWord, list] of Object.entries(groups)) {
    // 分组容器
    listHtml += `<div class="vp-group" style="margin-bottom: 8px;">`;
    // 【修改点】：只显示 displayWord，并用黑色加粗
    listHtml += `<div style="color:var(--text); font-weight: 700; font-size: 15px; margin-bottom: 6px;">${esc(displayWord)}</div>`;    
    // 分组内的具体释义
    list.forEach(v => {
      const realIdx = vocab.indexOf(v);
      listHtml += `
        <div class="vp-item" style="margin-top: 4px;">
          <span class="vp-mean">${esc(v.meaning || '（暂无释义）')}</span>
          <span class="vp-src">${esc(v.source || '')}</span>
          <span class="vp-del" data-action="del-vocab-pop" data-idx="${realIdx}" title="删除这条记录">×</span>
        </div>
      `;
    });
    
    listHtml += `</div>`;
  }

  const jumpHtml = qid
    ? `<button class="vp-jump" data-action="jump-q" data-qid="${qid}">查看题目</button>`
    : '';

  el.innerHTML = `
    <div class="vp-list" style="display:block;">${listHtml}</div>
    <div style="display:flex;justify-content:flex-end; margin-top:8px;">${jumpHtml}</div>
    `;
  document.body.appendChild(el);

  // 计算位置，防超出窗口
  const rect = el.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  let left = x;
  let top = y;
  if (left + w > window.innerWidth - 10) left = window.innerWidth - w - 10;
  if (left < 10) left = 10;
  if (top + h > window.innerHeight - 10) top = y - h - 12;
  if (top < 10) top = 10;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  vocabPopoverEl = el;
}

function markTextWithHighlights(text, ann, qid = null, optKey = null) {
  if (!text) return '';
  const ranges = [];

  // 1. 匹配生词（只匹配属于当前题/选项的词）
  (window.ANNOTATIONS.vocab || []).forEach(v => {
    if (v.target !== 'question') return; // 只管题目里的
    if (v.source !== getSourceLabel()) return; 
    // 如果当前在题干渲染，只拿属于题干没 optKey 的词；如果在选项渲染，只拿对应选项的词
    const vOpt = v.optKey || null;
    if (vOpt !== optKey) return; 
    
    // 如果不属于当前题号，跳过
    if (v.qid && v.qid !== qid) return; 

    const m = vocabMark(v);
    if (!m) return;
    let from = 0;
    while (true) {
      const idx = text.indexOf(m, from);
      if (idx === -1) break;
      ranges.push({ start: idx, end: idx + m.length, text: m, type: 'vocab' });
      from = idx + 1;
    }
  });

  // 2. 匹配定位句（定位句属于整道题，不需要分选项）
  if (ann && ann.locations) {
    ann.locations.forEach(l => {
      if (!l.text) return;
      const m = l.text;
      let from = 0;
      while (true) {
        const idx = text.indexOf(m, from);
        if (idx === -1) break;
        ranges.push({ start: idx, end: idx + m.length, text: m, type: 'loc' });
        from = idx + 1;
      }
    });
  }

  if (!ranges.length) return esc(text);

  // 去重与合并
  ranges.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const used = [];
  ranges.forEach(r => {
    if (used.some(u => !(r.end <= u.start || r.start >= u.end))) return;
    used.push(r);
  });
  used.sort((a, b) => a.start - b.start);

  let out = '';
  let cursor = 0;
  used.forEach(r => {
    out += esc(text.slice(cursor, r.start));
    const inner = esc(text.slice(r.start, r.end));
    
    if (r.type === 'vocab') {
      const cls = classifyVocab(r.text);
      out += `<span class="vocab-mark vocab-mark-${cls}" data-action="show-vocab" data-word="${esc(r.text)}">${inner}</span>`;
    } else if (r.type === 'loc') {
      out += `<span class="loc-mark">${inner}</span>`;
    }
    cursor = r.end;
  });
  out += esc(text.slice(cursor));
  return out;
}
function renderQCard(q, paper, section) {
  const ann = getAnn(paper, q.id);
  const num = q.id.replace(/^q/, '');
  const key = annKey(paper, q.id);
  const expanded = !!state.expanded[key];
  const showAns = !!state.showAnswer[key] || !!state.showSectionAnswer[section.id];
  const hasOptions = q.options && Object.keys(q.options).length > 0;
  const hasAnswer = q.answer && q.answer.trim();
  const correctAns = hasAnswer ? q.answer.trim().toUpperCase() : '';
  const userAns = ann.userAnswer || '';

  let optionsHtml = '';
  if (hasOptions) {
    optionsHtml = Object.entries(q.options).map(([k, v]) => {
      const optKeyCls = [];
      if (userAns === k && !showAns) optKeyCls.push('picked');
      if (showAns) {
        if (correctAns === k) optKeyCls.push('correct');
        else if (userAns === k) optKeyCls.push('wrong');
      }
      const optKeyId = key + '-' + k;
      const inputOpen = !!state.optTagOpen[optKeyId];
      const tags = getOptTags(ann, k);
      const tagBtnCls = 'opt-tag-btn' + (inputOpen || tags.length ? ' on' : '');
      const tagsInline = tags.length ? `
        <div class="opt-tags-inline">
          ${tags.map(t => `<span class="ot-chip">${esc(t)}<span class="rm" data-action="rm-opt-tag" data-qid="${q.id}" data-opt="${k}" data-tag="${esc(t)}">×</span></span>`).join('')}
        </div>
      ` : '';
      const draftKey = 'optTag:' + optKeyId;
      const draftVal = getDraft(draftKey);
      const inputWrap = inputOpen ? `
        <div class="opt-tag-wrap">
          <input list="allCustomTags" data-opt-tag-input data-qid="${q.id}" data-opt="${k}"
                 data-draft-key="${draftKey}"
                 value="${esc(draftVal)}"
                 placeholder="输入或选择标签，回车添加">
        </div>
      ` : '';
      return `
        <div class="opt-row">
          <span class="opt-key ${optKeyCls.join(' ')}" data-action="pick-answer" data-qid="${q.id}" data-opt="${k}" title="记录我的答案">${k}</span>
          <span class="opt-text">${markTextWithHighlights(v, ann, q.id, k)}</span>
          <button class="${tagBtnCls}" data-action="toggle-opt-tag" data-qid="${q.id}" data-opt="${k}" title="选项标签">${ICONS.tag}</button>
        </div>
        ${tagsInline}
        ${inputWrap}
      `;
    }).join('');
  }

  const stemText = q.stem && q.stem.trim() ? markTextWithHighlights(q.stem, ann, q.id, null) : '';
  const typePills = (ann.types || []).map(t =>
    `<span class="q-type-badge type-${t}">${esc(t)}</span>`
  ).join('');
  const indicators = typePills || '<span style="color:var(--text-light);font-size:11.5px;">未选题型</span>';

  const tagPanelOpen = !!state.tagPanel[key];
  let tagInputHtml = '';
  if (tagPanelOpen) {
    const chips = (ann.myTags || []).map(t =>
      `<span class="chip">${esc(t)}<span class="rm" data-action="rm-my-tag" data-qid="${q.id}" data-tag="${esc(t)}">×</span></span>`
    ).join('');
    const draftKey = 'myTag:' + key;
    const draftVal = getDraft(draftKey);
    tagInputHtml = `
      <div class="tag-input-wrap">
        <div class="chips">${chips}</div>
        <input list="allCustomTags" data-my-tag-input data-qid="${q.id}"
               data-draft-key="${draftKey}"
               value="${esc(draftVal)}"
               placeholder="输入或选择标签，回车添加">
      </div>
    `;
  }

  let expandedHtml = '';
  if (expanded) {
    const typeChips = (window.ANNOTATIONS.tagDefs.types || []).map(t =>
      `<span class="tag-chip type ${ann.types.includes(t) ? 'on' : ''}" data-action="toggle-type" data-qid="${q.id}" data-tag="${esc(t)}">${esc(t)}</span>`
    ).join('');
    const methodChips = (window.ANNOTATIONS.tagDefs.methods || []).map(m =>
      `<span class="tag-chip method ${ann.methods.includes(m) ? 'on' : ''}" data-action="toggle-method" data-qid="${q.id}" data-tag="${esc(m)}">${esc(m)}</span>`
    ).join('');
    const locItems = (ann.locations || []).map((l, i) => `
      <div class="loc-item">
        <span class="loc-para">[${l.para}]</span>
        <span class="loc-text" data-action="jump-para" data-para="${l.para}">${esc(l.text.length > 100 ? l.text.slice(0, 100) + '…' : l.text)}</span>
        <span class="loc-del" data-action="del-loc" data-qid="${q.id}" data-idx="${i}">${ICONS.x}</span>
      </div>
    `).join('');

    expandedHtml = `
      <div class="loc-panel">
        <div class="loc-title">
          <span>定位句 (${ann.locations.length})</span>
          <span style="font-size:10.5px;color:#854d0e;">选中文章文字添加</span>
        </div>
        ${locItems || '<div class="loc-empty">还没有定位句</div>'}
      </div>
      <div class="tag-area">
        <div class="tag-section">
          <div class="tag-section-title">题型</div>
          <div class="tag-chips">${typeChips}</div>
        </div>
        <div class="tag-section">
          <div class="tag-section-title">方法</div>
          <div class="tag-chips">${methodChips}</div>
        </div>
      </div>
    `;
  }

  const cardCls = ['q-card'];
  if (expanded) cardCls.push('expanded');
  if (ann.wrong) cardCls.push('wrong-card');
  else if (userAns) cardCls.push('done-card');

  return `
    <div class="${cardCls.join(' ')}" data-qid="${q.id}">
      <div class="q-head">
        <span class="q-badge">${num}</span>
        ${stemText ? `<span class="q-stem-text">${stemText}</span>` : ''}
      </div>
      ${optionsHtml ? `<div class="options-wrap">${optionsHtml}</div>` : ''}
      <div class="q-toggle-bar">
        <div class="q-indicators">${indicators}</div>
        <div class="q-toggle-actions">
          ${hasOptions ? `<button class="icon-btn sm ${tagPanelOpen ? 'on' : ''}" data-action="toggle-tag-panel" data-qid="${q.id}" title="题目标签">${ICONS.tag}</button>` : ''}
          <button class="icon-btn sm ${expanded ? 'on' : ''}" data-action="toggle-expand" data-qid="${q.id}" title="${expanded ? '收起标注' : '展开标注'}">${ICONS.edit}</button>
        </div>
      </div>
      ${tagInputHtml}
      ${expandedHtml}
    </div>
  `;
}

/* ===== Actions ===== */
function pickAnswer(qid, optKey) {
  const paper = getCurrentPaper();
  const ann = getAnn(paper, qid);
  ann.userAnswer = ann.userAnswer === optKey ? '' : optKey;
  
  const section = getCurrentSection();
  const key = annKey(paper, qid);
  
  // 只要当前是“显示答案”状态（不管是单题显示还是全篇显示），都要同步计算错题
  if (state.showAnswer[key] || (section && state.showSectionAnswer[section.id])) {
    const qs = getAllQuestionsInSection(section);
    const q = qs.find(x => x.id === qid);
    if (q && q.answer) {
      const correct = q.answer.trim().toUpperCase();
      ann.wrong = ann.userAnswer && ann.userAnswer !== correct;
    }
  }
  
  scheduleSave();
  renderQuestions();
}

function toggleShowAnswer(qid) {
  const paper = getCurrentPaper();
  const key = annKey(paper, qid);
  state.showAnswer[key] = !state.showAnswer[key];
  if (state.showAnswer[key]) {
    const section = getCurrentSection();
    const qs = getAllQuestionsInSection(section);
    const q = qs.find(x => x.id === qid);
    const ann = getAnn(paper, qid);
    if (q && q.answer && ann.userAnswer) {
      const correct = q.answer.trim().toUpperCase();
      ann.wrong = ann.userAnswer !== correct;
      scheduleSave();
    }
  }
  renderQuestions();
}

function toggleExpand(qid) {
  const paper = getCurrentPaper();
  const key = annKey(paper, qid);
  state.expanded[key] = !state.expanded[key];
  if (state.expanded[key]) state.tagPanel[key] = false;
  renderQuestions();
}

function toggleTagPanel(qid) {
  const paper = getCurrentPaper();
  const key = annKey(paper, qid);
  state.tagPanel[key] = !state.tagPanel[key];
  if (state.tagPanel[key]) state.expanded[key] = false;
  renderQuestions();
}

function toggleOptTagInput(qid, optKey) {
  const paper = getCurrentPaper();
  const id = annKey(paper, qid) + '-' + optKey;
  state.optTagOpen[id] = !state.optTagOpen[id];
  renderQuestions();
}

function addOptTag(qid, optKey, val) {
  const paper = getCurrentPaper();
  const customTags = window.ANNOTATIONS.customTags || (window.ANNOTATIONS.customTags = []);
  if (!customTags.includes(val)) customTags.push(val);
  const ann = getAnn(paper, qid);
  const tags = getOptTags(ann, optKey);
  if (!tags.includes(val)) tags.push(val);
  // 清草稿
  const draftKey = 'optTag:' + annKey(paper, qid) + '-' + optKey;
  delete state.inputDrafts[draftKey];
  updateDatalist();
  scheduleSave();
  renderQuestions();
}

function removeOptTag(qid, optKey, tag) {
  const paper = getCurrentPaper();
  const ann = getAnn(paper, qid);
  const tags = getOptTags(ann, optKey);
  const i = tags.indexOf(tag);
  if (i >= 0) tags.splice(i, 1);
  scheduleSave();
  renderQuestions();
}

function toggleType(qid, tag) {
  const paper = getCurrentPaper();

function toggleMethod(qid, tag) {
